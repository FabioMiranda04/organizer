<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1220">
<meta name="theme-color" content="#dcecf8">
<title>Organizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='h' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb3e6'/%3E%3Cstop offset='.4' stop-color='%238ecbff'/%3E%3Cstop offset='.75' stop-color='%239df5e4'/%3E%3Cstop offset='1' stop-color='%23fff0a8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23h)'/%3E%3Cpath d='M16 3C17 11 21 15 29 16 21 17 17 21 16 29 15 21 11 17 3 16 11 15 15 11 16 3Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bungee&family=Nunito+Sans:wght@400;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #123249;
    --tinta-fraca: #5b83a0;
    --aco: #7ba8c6;
    --borda: #b9d6ea;
    --borda-forte: #8dbcdc;
    --azul: #2b7fc0;
    --menta: #35b58a;
    --rosa: #e0559c;
    --papel: #ffffff;
    --raio: 12px;
    --holo: linear-gradient(115deg, #ffb3e6, #c8a8ff, #8ecbff, #9df5e4, #fff0a8, #ffb3e6);
    --holo-forte: linear-gradient(115deg, #ff5ec4, #9b6bff, #34a8ff, #22e6b0, #ffd447, #ff5ec4);
    --sans: "Nunito Sans", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    /* fonte de pixel só em rótulo fixo: ela não tem acento */
    --pixel: "Silkscreen", ui-monospace, Consolas, monospace;
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --tag: "Bungee", "Archivo Black", "Arial Black", Impact, sans-serif;
  }
  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background:
      radial-gradient(72% 48% at 80% -4%, rgba(255,255,255,.95), rgba(255,255,255,0) 62%),
      radial-gradient(64% 46% at 6% 104%, rgba(178,224,255,.85), rgba(255,255,255,0) 66%),
      linear-gradient(180deg, #c9e3f7 0%, #e9f4fc 42%, #d9ebf8 100%);
  }
  body {
    margin: 0; min-width: 1220px;
    color: var(--tinta);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }

  /* manchas de cor no fundo — sem elas o vidro não tem o que distorcer */
  .aura { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .aura i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .42; }
  .aura i:nth-child(1) { width: 460px; height: 420px; left: -6%;  top: -12%; background: #ff9ad8; }
  .aura i:nth-child(2) { width: 520px; height: 460px; right: -8%; top: 2%;   background: #8fb6ff; }
  .aura i:nth-child(3) { width: 420px; height: 380px; left: 34%;  bottom: -14%; background: #7ff0d4; }
  .aura i:nth-child(4) { width: 300px; height: 300px; right: 18%; bottom: -8%;  background: #c9a6ff; opacity: .3; }
  .aura i { animation: boiar 22s ease-in-out infinite alternate; }
  .aura i:nth-child(2) { animation-duration: 28s; animation-delay: -6s; }
  .aura i:nth-child(3) { animation-duration: 34s; animation-delay: -12s; }
  .aura i:nth-child(4) { animation-duration: 26s; animation-delay: -3s; }
  @keyframes boiar { to { transform: translate3d(40px, -30px, 0); } }

  /* coisas flutuando atrás do vidro — o backdrop-filter as desfoca de graça */
  .ambiente { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  body.parado .ambiente i, body.parado .aura i,
  body.parado .mascote .pula, body.parado .vitrine .blob { animation-play-state: paused; }
  .ambiente i { position: absolute; display: block; }
  .ambiente .bolha {
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,1) 0 9%, rgba(255,255,255,.4) 24%, rgba(255,255,255,0) 44%),
      radial-gradient(circle at 70% 76%, rgba(255,186,240,.5), rgba(150,220,255,.4) 58%, rgba(255,255,255,.28) 100%);
    box-shadow: inset 0 0 14px rgba(255,255,255,.85), 0 6px 18px rgba(70,130,180,.16);
    animation: flutuar linear infinite;
  }
  @keyframes flutuar {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(var(--dx), -122vh, 0); }
  }
  .ambiente .faisca {
    background: #fff;
    clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
    filter: drop-shadow(0 0 6px rgba(160,220,255,.9));
    animation: piscar ease-in-out infinite;
  }
  @keyframes piscar {
    0%, 100% { opacity: 0; transform: scale(.25) rotate(0deg); }
    50%      { opacity: .95; transform: scale(1) rotate(50deg); }
  }
  .ambiente .disco {
    border-radius: 50%;
    background: var(--holo-forte);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.85), inset 0 0 0 6px rgba(120,170,210,.35),
                0 6px 16px rgba(60,110,160,.28);
    animation: vagar linear infinite;
  }
  @keyframes vagar {
    from { transform: translate3d(0, 0, 0) rotate(0deg); }
    to   { transform: translate3d(var(--dx), var(--dy), 0) rotate(720deg); }
  }

  /* ---------- utilidades y2k ---------- */
  .holo, .iris {
    background: var(--holo);
    background-size: 340% 340%;
    animation: iris 22s linear infinite;
  }
  @keyframes iris {
    to { filter: hue-rotate(360deg); }
  }
  .barcode {
    width: 86px; height: 20px; flex: none;
    background: repeating-linear-gradient(90deg,
      #1b3a52 0 1px, transparent 1px 3px, #1b3a52 3px 5px, transparent 5px 6px,
      #1b3a52 6px 8px, transparent 8px 11px, #1b3a52 11px 12px, transparent 12px 14px);
    opacity: .8;
  }
  .pixels { display: flex; gap: 2px; }
  .pixels i { width: 4px; height: 4px; background: var(--aco); }
  .pixels i:nth-child(3n) { background: var(--rosa); }
  .pixels i:nth-child(4n) { background: var(--azul); opacity: .6; }
  .hud, .contador, .placar, .indice {
    font-variant-numeric: tabular-nums;
  }
  .hud {
    font: 400 9px/1 var(--pixel); letter-spacing: .18em;
    text-transform: uppercase; color: var(--tinta-fraca);
  }

  /* botão pill envidraçado (aqua) */
  .pill {
    position: relative; overflow: hidden;
    padding: 8px 20px 9px; border-radius: 999px;
    font: 500 13px/1 var(--sans); color: #17567f; white-space: nowrap;
    background: linear-gradient(180deg, #f8fcff 0%, #dcf0fc 46%, #b2dcf6 52%, #d6edff 100%);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 3px 6px rgba(30,90,130,.2), inset 0 1px 0 #fff, inset 0 -7px 10px rgba(150,205,235,.4);
    transition: transform .13s, box-shadow .13s, filter .13s;
  }
  .pill::after {
    content: ''; position: absolute; left: 4%; right: 4%; top: 2px; height: 42%;
    border-radius: 999px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.15));
  }
  .pill:hover { transform: translateY(-1px); filter: brightness(1.04); }
  .pill:active { transform: translateY(1px); }
  .pill.on {
    color: #14324a; border-color: #fff; background: transparent;
    box-shadow: 0 4px 12px rgba(120,70,180,.3), inset 0 1px 0 rgba(255,255,255,.9);
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
  }
  /* o holográfico vive numa camada atrás do texto: assim o hue-rotate da
     animação não tinge junto o rótulo da pill */
  .pill.on::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: var(--holo); background-size: 340% 340%;
    animation: iris 22s linear infinite;
  }

  /* ---------- casca ---------- */
  .folha { position: relative; z-index: 1; width: 1180px; margin: 0 auto; padding: 24px 0 40px; }
  .painel {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.58));
    backdrop-filter: blur(13px) saturate(180%);
    -webkit-backdrop-filter: blur(13px) saturate(180%);
    border: 1px solid rgba(255,255,255,.75);
    border-radius: var(--raio);
    box-shadow:
      0 10px 26px rgba(30,90,130,.16),
      0 1px 0 rgba(255,255,255,.9) inset,
      0 -12px 22px rgba(255,255,255,.45) inset,
      0 0 0 1px rgba(160,205,235,.35);
  }
  /* aresta especular: o brilho que corre na borda de cima do vidro */
  .painel::after {
    content: ''; position: absolute; left: 7%; right: 7%; top: 0; height: 1px;
    pointer-events: none;
    background: linear-gradient(90deg,
      rgba(255,255,255,0), rgba(255,255,255,.98) 22%, rgba(255,255,255,.98) 78%, rgba(255,255,255,0));
  }

  /* ---------- banner ---------- */
  .banner {
    display: flex; overflow: hidden; padding: 0;
    box-shadow: 0 18px 40px rgba(30,90,130,.18), inset 0 1px 0 #fff;
  }
  .banner .esq { flex: 1; padding: 22px 24px 18px; }
  .marca { display: flex; align-items: flex-start; gap: 10px; }
  h1 {
    margin: 0; font: 400 58px/.9 var(--display); letter-spacing: -.02em;
    background: linear-gradient(180deg,
      #ffffff 0%, #dceefb 9%, #a9c8de 23%, #2f5772 41%,
      #0b2233 50%, #4a7b99 55%, #dff2ff 63%, #ffffff 70%,
      #b9d3e4 84%, #5f88a3 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1.4px rgba(20, 60, 90, .6);
    filter: drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 6px 12px rgba(30,80,120,.3));
  }
  .marca .estrela { width: 26px; height: 26px; margin-top: 4px; }
  .sub { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .sub .linha { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--borda-forte) 0 3px, transparent 3px 7px); }
  .lema { font: 400 11px/1 var(--pixel); letter-spacing: .3em; text-transform: uppercase; color: var(--tinta-fraca); }
  .banner .backup { margin-top: 18px; display: flex; align-items: center; gap: 8px; }
  .banner .backup .hud { margin-left: auto; }

  .vitrine {
    position: relative; width: 400px; flex: none; overflow: hidden;
    border-left: 1px solid var(--borda);
    background: linear-gradient(180deg, rgba(191,226,250,.72), rgba(234,246,255,.5) 60%, rgba(223,240,253,.66));
  }
  .vitrine .blob {
    position: absolute; left: 16%; top: 12%; width: 240px; height: 170px;
    border-radius: 62% 38% 46% 54% / 54% 62% 38% 46%;
    animation: morfar 17s ease-in-out infinite alternate;
    will-change: transform;
    box-shadow: inset 0 -18px 34px rgba(255,255,255,.75), inset 0 14px 30px rgba(90,40,140,.28),
                0 14px 30px rgba(80,60,140,.28);
  }
  .vitrine .blob::after {
    content: ''; position: absolute; left: 16%; top: 12%; width: 40%; height: 26%;
    border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.1));
  }
  .vitrine .bolha {
    position: absolute; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 26%, rgba(255,255,255,1) 0 8%, rgba(255,255,255,.35) 22%, rgba(255,255,255,0) 42%),
      radial-gradient(circle at 68% 76%, rgba(255,200,245,.6), rgba(160,220,255,.35) 55%, rgba(255,255,255,.2) 100%);
    box-shadow: inset 0 0 14px rgba(255,255,255,.85), 0 6px 14px rgba(70,120,160,.25);
  }
  .vitrine .grade {
    position: absolute; right: -34px; bottom: -46px; width: 190px; opacity: .5;
    animation: rodar 46s linear infinite;
  }
  @keyframes morfar {
    from { transform: rotate(0deg) scale(1, 1); }
    to   { transform: rotate(24deg) scale(1.07, .93); }
  }
  @keyframes rodar { to { transform: rotate(360deg); } }
  .vitrine .flare {
    position: absolute; left: 24%; top: 22%; width: 200px; height: 200px;
    transform: translate(-50%, -50%); pointer-events: none;
    background:
      radial-gradient(circle, rgba(255,255,255,.95) 0 3%, rgba(255,255,255,0) 26%),
      linear-gradient(90deg, rgba(255,255,255,0) 6%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 94%) center/100% 2px no-repeat,
      linear-gradient(180deg, rgba(255,255,255,0) 18%, rgba(255,255,255,.6) 50%, rgba(255,255,255,0) 82%) center/2px 100% no-repeat;
  }
  .cintila { animation: cintilar 3.4s ease-in-out infinite; transform-origin: center; }
  @keyframes cintilar { 0%, 100% { opacity: .95; transform: scale(1); } 50% { opacity: .45; transform: scale(.82); } }
  @media (prefers-reduced-motion: reduce) {
    .holo, .iris, .pill.on, .cintila, .aura i,
    .ambiente i, .vitrine .blob, .vitrine .grade, .tv .led,
    .mascote .pula, .mascote img.rodando { animation: none; }
    .ambiente .faisca { opacity: .7; }
    .fantasma .cartao { animation: none; transform: rotate(-2deg) scale(1.03); }
    body.tremendo .folha { animation: none; }
  }

  /* ---------- barra de projetos ---------- */
  .barra {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding: 12px 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(233,244,252,.5));
  }
  .projetos { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .pill.novo {
    background: #f3f9fd; border-style: dashed; border-color: var(--borda-forte);
    color: var(--tinta-fraca); font-size: 12px; padding: 8px 15px 9px;
  }
  .pill.novo::after { display: none; }
  .entrada {
    padding: 8px 14px; border-radius: 999px; width: 190px;
    border: 1px solid var(--azul); background: #fff; outline: none;
    font: 500 13px/1 var(--sans);
  }
  .acoes { display: flex; gap: 10px; }
  .acoes button {
    font: 400 9px/1 var(--pixel); letter-spacing: .18em; text-transform: uppercase;
    color: var(--tinta-fraca); border-bottom: 1px solid var(--borda-forte); padding-bottom: 2px;
  }
  .acoes button:hover { color: var(--azul); border-color: var(--azul); }

  /* widget de progresso, no espírito do "playing : song" */
  .widget {
    margin-left: auto; flex: none; width: 232px;
    border: 1px solid rgba(255,255,255,.8); border-radius: 7px; overflow: hidden;
    background: #f5fafe;
    box-shadow: inset 0 1px 3px rgba(60,110,150,.16);
  }
  .widget .cima {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px; border-bottom: 1px solid #dbebf6;
    background: linear-gradient(180deg, #fff, #eaf4fb);
  }
  .widget .placar { font: 500 10px/1 var(--pixel); color: var(--azul); }
  .celulas { display: flex; gap: 2px; padding: 6px 8px 7px; }
  .celulas i {
    flex: 1; height: 10px; border-radius: 1px;
    background: #e3eef6; box-shadow: inset 0 1px 0 #fff;
  }
  .celulas i.on {
    background-image: var(--holo-forte);
    background-size: 2400% 100%;
    background-position: calc(var(--i) * 4.35%) 50%;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 0 6px rgba(150,120,255,.35);
  }

  /* ---------- faixa de título ---------- */
  .faixa { display: flex; align-items: center; gap: 12px; margin: 20px 2px 12px; }
  .seta {
    width: 54px; height: 12px; flex: none;
    background: linear-gradient(90deg, var(--azul), #9fd0ee);
    clip-path: polygon(0 40%, 62% 40%, 62% 0, 100% 50%, 62% 100%, 62% 60%, 0 60%);
    opacity: .75;
  }
  .faixa h2 {
    margin: 0; font: 700 21px/1 var(--sans); letter-spacing: -.01em; color: #245a80;
  }
  .faixa .diamante { width: 11px; height: 11px; transform: rotate(45deg); background: var(--holo-forte); background-size: 300% 300%; animation: iris 22s linear infinite; border: 1px solid #fff; }
  .faixa .linha { flex: 1; height: 3px; background: linear-gradient(90deg, var(--borda-forte), rgba(185,214,234,0)); border-radius: 2px; }

  /* ---------- quadro ---------- */
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
  .coluna {
    padding: 14px; min-height: 260px;
    box-shadow: 0 3px 10px rgba(30,90,130,.08), inset 0 1px 0 #fff;
    transition: border-color .16s, box-shadow .16s;
  }
  .coluna.alvo {
    border-color: var(--azul); border-style: dashed;
    box-shadow: 0 0 0 3px rgba(43,127,192,.16), 0 10px 26px rgba(30,90,130,.16);
  }
  .coluna { overflow: hidden; }
  .coluna h3 {
    display: flex; align-items: center; gap: 8px;
    margin: -14px -14px 12px; padding: 11px 13px;
    background: linear-gradient(180deg, rgba(251,253,255,.75), rgba(228,241,251,.6));
    border-bottom: 1px solid rgba(255,255,255,.7);
    font: 700 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #245a80;
  }
  .indice { font: 400 11px/1 var(--pixel); color: #fff; background: var(--ac); padding: 3px 5px; border-radius: 3px; }
  .risca { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--borda) 0 3px, transparent 3px 6px); }
  .contador { font: 500 11px/1 var(--pixel); color: var(--tinta-fraca); }
  .limpar {
    font: 400 9px/1 var(--pixel); letter-spacing: .16em; text-transform: uppercase;
    color: var(--tinta-fraca); border-bottom: 1px solid var(--borda-forte); padding-bottom: 2px;
  }
  .limpar:hover { color: var(--rosa); border-color: var(--rosa); }

  .cartao {
    position: relative; display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 11px 11px 14px; margin-bottom: 8px; border-radius: 9px; cursor: grab;
    background: linear-gradient(180deg, #ffffff, #f3f9fe);
    border: 1px solid rgba(255,255,255,.85);
    box-shadow: 0 2px 5px rgba(40,100,140,.1), inset 0 1px 0 #fff,
                inset 0 -8px 14px rgba(255,255,255,.5), 0 0 0 1px rgba(173,212,238,.4);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .cartao::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    border-radius: 9px 0 0 9px;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--cor) 72%, #fff), var(--cor) 55%,
      color-mix(in srgb, var(--cor) 82%, #000));
    box-shadow: inset -1px 0 0 rgba(255,255,255,.5);
  }
  .cartao:hover {
    transform: translateY(-2px);
    border-color: var(--borda-forte);
    box-shadow: 0 8px 18px rgba(40,100,140,.18), inset 0 1px 0 #fff;
  }
  .cartao:active { cursor: grabbing; }
  /* o cartão que segue o cursor: clone real, para poder balançar */
  .fantasma { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; will-change: transform; }
  .fantasma .cartao {
    margin: 0; cursor: grabbing;
    backdrop-filter: none; -webkit-backdrop-filter: none;
    background: linear-gradient(180deg, #ffffff, #f4fafe);
    box-shadow: 0 22px 40px rgba(20,70,110,.32), 0 4px 10px rgba(20,70,110,.2), inset 0 1px 0 #fff;
    transform-origin: 50% -14%;
    animation: bambolear .72s ease-in-out infinite;
  }
  .fantasma .setas { display: none; }
  /* pêndulo: gira em torno de um ponto acima do cartão, como se estivesse pendurado */
  @keyframes bambolear {
    0%   { transform: rotate(-3.4deg) scale(1.03); }
    25%  { transform: rotate(2.9deg)  scale(1.03); }
    50%  { transform: rotate(-2.3deg) scale(1.03); }
    75%  { transform: rotate(1.9deg)  scale(1.03); }
    100% { transform: rotate(-3.4deg) scale(1.03); }
  }
  body.arrastando-agora, body.arrastando-agora * { cursor: grabbing !important; }
  .cartao.arrastando { opacity: .4; }
  /* a linha azul mostra onde o cartão vai cair; depois do :hover para vencer a cascata */
  .cartao.solta-antes  { box-shadow: 0 -3px 0 0 var(--azul), 0 2px 5px rgba(40,100,140,.1); }
  .cartao.solta-depois { box-shadow: 0 3px 0 0 var(--azul), 0 2px 5px rgba(40,100,140,.1); }
  .cartao .texto { flex: 1; word-break: break-word; font-size: 14px; user-select: none; }
  .cartao .texto span[contenteditable] { outline: none; display: block; }
  .cartao .texto span[contenteditable="true"] {
    user-select: text; background: #fff; border-radius: 4px; padding: 1px 4px; margin: -1px -4px;
    box-shadow: 0 0 0 2px rgba(43,127,192,.35);
  }
  .cartao.feito { background: linear-gradient(180deg, #fbfffd, #eefaf5); border-color: #cfeade; }
  .cartao.feito::before { background: linear-gradient(180deg, #7fe6bf, var(--menta)); }
  .cartao.feito .texto span[contenteditable] { color: #6d9a8b; text-decoration: line-through; }

  .etiqueta {
    display: inline-flex; align-items: center; gap: 5px; margin-bottom: 5px;
    font: 800 9px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-fraca);
  }
  .etiqueta::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: var(--cor); box-shadow: 0 0 0 1px rgba(255,255,255,.8); }

  .setas { display: flex; gap: 3px; opacity: 0; transition: opacity .15s; }
  .cartao:hover .setas { opacity: 1; }
  .setas button {
    width: 21px; height: 21px; border-radius: 5px; font: 400 12px/1 var(--pixel); color: #4a7f9f;
    background: linear-gradient(180deg, #fff, #e4f1fa);
    border: 1px solid #c3dcec; box-shadow: inset 0 1px 0 #fff;
  }
  .setas button:hover { background: linear-gradient(180deg, #d8f0ff, #a9d8f4); color: #14324a; }
  .setas button.x:hover { background: linear-gradient(180deg, #ffd9ea, #f7a8cc); border-color: #e78ab5; }
  .vazio { font: 400 10px/1 var(--pixel); letter-spacing: .18em; color: #9dbdd2; padding: 4px 2px 14px; }

  .nova {
    width: 100%; padding: 9px 12px; border-radius: 999px;
    background: #f7fbfe; color: var(--tinta);
    border: 1px solid var(--borda);
    box-shadow: inset 0 1px 3px rgba(60,110,150,.12);
    font: 400 12px/1 var(--sans);
  }
  .nova::placeholder { color: #9dbdd2; font-family: var(--pixel); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .nova:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(43,127,192,.15); }
  .nova:disabled { opacity: .55; cursor: not-allowed; }

  /* ---------- comemoração ao concluir ---------- */
  #palco { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; }
  #palco > * { position: absolute; }

  /* um flash só, nunca pisca-pisca: estroboscópio é gatilho de crise fotossensível */
  .flash { inset: 0; background: #fff; animation: apagar .28s ease-out forwards; }
  @keyframes apagar { from { opacity: .92; } to { opacity: 0; } }

  .onda {
    width: 60px; height: 60px; border-radius: 50%; border: 5px solid currentColor;
    transform: translate(-50%, -50%) scale(.1);
    animation: expandir .75s cubic-bezier(.15, .75, .25, 1) forwards;
  }
  @keyframes expandir {
    from { transform: translate(-50%, -50%) scale(.1); opacity: 1; }
    to   { transform: translate(-50%, -50%) scale(22); opacity: 0; }
  }

  .raios {
    width: 300px; height: 300px; border-radius: 50%;
    transform: translate(-50%, -50%) scale(.15);
    background: repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.85) 0deg 2deg, rgba(255,255,255,0) 2deg 9deg);
    -webkit-mask-image: radial-gradient(circle, #000 8%, rgba(0,0,0,.5) 34%, transparent 62%);
    mask-image: radial-gradient(circle, #000 8%, rgba(0,0,0,.5) 34%, transparent 62%);
    animation: estourar .8s cubic-bezier(.12, .8, .3, 1) forwards;
  }
  @keyframes estourar {
    from { transform: translate(-50%, -50%) scale(.15) rotate(0deg); opacity: 1; }
    to   { transform: translate(-50%, -50%) scale(5) rotate(48deg); opacity: 0; }
  }

  .confete { width: 15px; height: 15px; animation: esguichar 1s cubic-bezier(.1, .75, .3, 1) forwards; }
  .confete.estrela {
    background: #fff;
    clip-path: polygon(50% 0%, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0% 50%, 42% 42%);
  }
  .confete.spray { border-radius: 50%; background: var(--cor); box-shadow: 0 0 0 2px rgba(255,255,255,.75); }
  .confete.cd {
    border-radius: 50%;
    background: var(--holo-forte);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.85);
  }
  @keyframes esguichar {
    from { transform: translate(-50%, -50%) rotate(0deg) scale(.2); opacity: 1; }
    70%  { opacity: 1; }
    to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
                      rotate(var(--r)) scale(1.1); opacity: 0; }
  }

  .slam {
    left: 50%; top: 42%; white-space: nowrap;
    font: 400 clamp(48px, 7.4vw, 96px)/1 var(--tag); letter-spacing: -.01em;
    color: var(--cor);
    /* contorno de caneta de marcar + sombra dura: adesivo, não relevo */
    text-shadow:
      -3px -3px 0 #fff,  3px -3px 0 #fff, -3px 3px 0 #fff,  3px 3px 0 #fff,
      -4px 0 0 #fff, 4px 0 0 #fff, 0 -4px 0 #fff, 0 4px 0 #fff,
      9px 9px 0 #0b1b2a;
    animation: bater .95s cubic-bezier(.16, 1.5, .38, 1) forwards;
  }
  @keyframes bater {
    from { transform: translate(-50%, -50%) scale(3.2) skewX(-14deg) rotate(-18deg); opacity: 0; }
    18%  { transform: translate(-50%, -50%) scale(1)   skewX(-8deg)  rotate(-5deg);  opacity: 1; }
    70%  { transform: translate(-50%, -50%) scale(1.03) skewX(-8deg) rotate(-5deg);  opacity: 1; }
    to   { transform: translate(-50%, -50%) scale(1.55) skewX(-8deg) rotate(-5deg);  opacity: 0; }
  }

  .placar-festa {
    left: 50%; top: 42%; margin-top: 74px; white-space: nowrap;
    display: flex; gap: 12px; align-items: center;
    transform: translate(-50%, 0) rotate(-5deg);
    font: 400 clamp(15px, 1.7vw, 22px)/1 var(--tag);
    animation: subir-placar 1.1s cubic-bezier(.16, 1.4, .4, 1) forwards;
  }
  .placar-festa span {
    padding: 7px 12px 6px; color: #0b1b2a; background: #fff;
    box-shadow: 5px 5px 0 #0b1b2a;
  }
  .placar-festa .combo { color: #fff; background: var(--cor); }
  @keyframes subir-placar {
    from { opacity: 0; transform: translate(-50%, 26px) rotate(-5deg); }
    22%  { opacity: 1; transform: translate(-50%, 0) rotate(-5deg); }
    75%  { opacity: 1; transform: translate(-50%, 0) rotate(-5deg); }
    to   { opacity: 0; transform: translate(-50%, -22px) rotate(-5deg); }
  }

  /* só translação: a folha é toda vidro, e girar/escalar backdrop-filter borra */
  body.tremendo .folha { animation: tremer .58s cubic-bezier(.36, .07, .19, .97); }
  @keyframes tremer {
    10%, 90% { transform: translate(-7px, 4px); }
    20%, 80% { transform: translate(10px, -5px); }
    30%, 50%, 70% { transform: translate(-14px, 6px); }
    40%, 60% { transform: translate(14px, -6px); }
    100% { transform: none; }
  }

  /* ---------- mascote ---------- */
  .mascote {
    position: fixed; left: 10px; bottom: 2px; z-index: 51; width: 124px;
    pointer-events: none;
  }
  .mascote[hidden] { display: none; }
  .mascote .pula { animation: boiar 4.4s ease-in-out infinite; will-change: transform; }
  @keyframes boiar {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-11px); }
  }
  .mascote img {
    display: block; width: 100%; height: auto; cursor: pointer; pointer-events: auto;
    /* a arte veio com fundo branco chapado, sem canal alfa; multiply apaga o
       branco contra o fundo claro da página e preserva o traço */
    mix-blend-mode: multiply;
    transform: rotate(-2deg);
  }
  .mascote img.rodando { animation: rodopiar 1.15s cubic-bezier(.42, 0, .22, 1); }
  @keyframes rodopiar {
    0%   { transform: rotate(-2deg) scale(1); }
    55%  { transform: rotate(382deg) scale(1.14); }
    100% { transform: rotate(358deg) scale(1); }
  }
  .mascote .fala {
    position: absolute; left: 58%; bottom: 84%; width: 176px; margin: 0;
    padding: 9px 12px 10px; border: 2px solid #16334b; border-radius: 13px;
    background: #fff; color: var(--tinta);
    font: 700 12px/1.3 var(--sans);
    box-shadow: 5px 5px 0 #16334b;
    opacity: 0; transform: translateY(8px) scale(.92); transform-origin: 0 100%;
    transition: opacity .18s, transform .28s cubic-bezier(.2, 1.4, .4, 1);
  }
  .mascote .fala.on { opacity: 1; transform: none; }
  .mascote .fala::after {
    content: ''; position: absolute; left: -9px; bottom: 13px; width: 13px; height: 13px;
    background: #fff; border-left: 2px solid #16334b; border-bottom: 2px solid #16334b;
    transform: rotate(45deg);
  }

/* ---------- tevê de gato ---------- */
  .tv { position: fixed; right: 20px; bottom: 20px; z-index: 50; width: 212px; }
  .tv[hidden] { display: none; }
  .tv .antena { position: absolute; left: 50%; top: -30px; width: 2px; height: 30px; }
  .tv .antena::before, .tv .antena::after {
    content: ''; position: absolute; bottom: 0; left: 0; width: 2px; height: 30px;
    background: linear-gradient(180deg, #b9d6ea, #7ba8c6);
    border-radius: 2px; transform-origin: bottom center;
    box-shadow: 0 -2px 0 0 #fff;
  }
  .tv .antena::before { transform: rotate(-27deg); }
  .tv .antena::after  { transform: rotate(27deg); }

  .tv .corpo {
    padding: 10px 10px 7px; border-radius: 17px;
    background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(212,235,250,.88));
    border: 1px solid rgba(255,255,255,.92);
    box-shadow: 0 16px 32px rgba(30,90,130,.3), inset 0 1px 0 #fff,
                inset 0 -12px 18px rgba(150,205,235,.45);
  }
  .tv .tela {
    position: relative; height: 134px; overflow: hidden; cursor: pointer;
    border-radius: 14px / 19px; background: #08111c;
    box-shadow: inset 0 0 0 3px #16334b, inset 0 0 26px rgba(0,0,0,.85);
  }
  .tv .tela img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .2s; }
  .tv .tela img.no-ar { opacity: 1; }
  .tv canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: 0; }
  .tv canvas.ligado { opacity: 1; }
  .tv .aviso {
    position: absolute; left: 0; right: 0; bottom: 12px; margin: 0; text-align: center;
    font: 400 9px/1 var(--pixel); letter-spacing: .2em; text-transform: uppercase;
    color: #cfe6ff; text-shadow: 0 1px 3px #000;
  }
  .tv .vidro {
    position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.26) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 78% at 28% 10%, rgba(255,255,255,.3), rgba(255,255,255,0) 54%),
      radial-gradient(105% 105% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,.6) 100%);
  }
  .tv .controles { display: flex; align-items: center; gap: 7px; padding: 7px 3px 0; }
  .tv .canal { font: 400 8px/1 var(--pixel); letter-spacing: .16em; color: #2b6c8b; }
  .tv .led {
    width: 7px; height: 7px; border-radius: 50%; background: #35d67f;
    box-shadow: 0 0 7px #35d67f, inset 0 1px 0 rgba(255,255,255,.9);
    animation: pulsar 2.6s ease-in-out infinite;
  }
  @keyframes pulsar { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .tv .grelha {
    flex: 1; height: 9px; border-radius: 3px;
    background: repeating-linear-gradient(90deg, rgba(90,140,175,.5) 0 2px, rgba(0,0,0,0) 2px 5px);
  }
  .tv .desliga {
    font: 400 11px/1 var(--sans); color: #2b6c8b;
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(180deg, #fff, #dcefFB);
    box-shadow: inset 0 1px 0 #fff, 0 2px 4px rgba(30,90,130,.25);
  }
  .tv .desliga:hover { color: #fff; background: linear-gradient(180deg, #7fd0ee, #2b7fc0); }

  /* ---------- rodapé ---------- */
  .rodape { display: flex; align-items: center; gap: 12px; margin-top: 20px; padding: 0 2px; }
  .rodape .linha { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--borda-forte) 0 2px, transparent 2px 6px); }
  .rodape .titulo { font: 700 13px/1 var(--sans); color: #4a7f9f; letter-spacing: .04em; }
</style>

<script>
const CHAVE = 'organizer.kanban.v1';
const COLUNAS = [
  ['backlog', 'Backlog', '#7ba8c6'],
  ['fazendo', 'Fazendo', '#2b7fc0'],
  ['feito',   'Feito',   '#35b58a'],
];
const CELULAS = 24;

let dados = carregar();
let arrastando = null;
let destino = null;
let ponteiro = { x: innerWidth / 2, y: innerHeight / 2 };
let audio = null;

addEventListener('pointermove', e => { ponteiro = { x: e.clientX, y: e.clientY }; }, { passive: true });
// aba em segundo plano não precisa gastar quadro com bolha nenhuma
document.addEventListener('visibilitychange',
  () => document.body.classList.toggle('parado', document.hidden));

function carregar() {
  try {
    const bruto = JSON.parse(localStorage.getItem(CHAVE));
    if (bruto && Array.isArray(bruto.projetos)) return bruto;
  } catch {}
  const id = novoId();
  return { projetos: [{ id, nome: 'Geral' }], tarefas: [], filtro: id };
}

function salvar() { localStorage.setItem(CHAVE, JSON.stringify(dados)); }
function novoId() { return Math.random().toString(36).slice(2, 10); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
// paleta fixa em vez de hash: hash de id vizinho cai no mesmo matiz e os
// projetos saem todos da mesma cor
const PALETA = ['#f0569e', '#8b6cf0', '#2b9fe0', '#23c3a0', '#f2a03c', '#e0574f', '#6cc04a', '#b45ee0'];
function cor(id) {
  const i = dados.projetos.findIndex(p => p.id === id);
  return PALETA[(i < 0 ? 0 : i) % PALETA.length];
}
function visiveis() {
  return dados.filtro === 'todos' ? dados.tarefas : dados.tarefas.filter(t => t.projeto === dados.filtro);
}

(function ambiente() {
  const alvo = document.querySelector('.ambiente');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const criar = (classe, css) => {
    const i = document.createElement('i');
    i.className = classe;
    i.style.cssText = css;
    alvo.append(i);
  };

  for (let n = 0; n < 6; n++) {                       // bolhas subindo
    const d = rnd(26, 120);
    criar('bolha', `left:${rnd(0, 96)}%;top:${rnd(70, 125)}%;width:${d}px;height:${d}px;` +
      `opacity:${rnd(.3, .7).toFixed(2)};--dx:${rnd(-70, 70).toFixed(0)}px;` +
      `animation-duration:${rnd(26, 52).toFixed(0)}s;animation-delay:-${rnd(0, 40).toFixed(0)}s`);
  }
  for (let n = 0; n < 6; n++) {                        // faíscas piscando
    const d = rnd(9, 26);
    criar('faisca', `left:${rnd(2, 97)}%;top:${rnd(4, 94)}%;width:${d}px;height:${d}px;` +
      `animation-duration:${rnd(2.4, 5.5).toFixed(1)}s;animation-delay:-${rnd(0, 5).toFixed(1)}s`);
  }
  for (let n = 0; n < 3; n++) {                        // mini CDs vagando
    const d = rnd(30, 62);
    criar('disco', `left:${rnd(4, 90)}%;top:${rnd(10, 88)}%;width:${d}px;height:${d}px;` +
      `opacity:${rnd(.3, .55).toFixed(2)};--dx:${rnd(-220, 220).toFixed(0)}px;--dy:${rnd(-180, 180).toFixed(0)}px;` +
      `animation-duration:${rnd(34, 62).toFixed(0)}s;animation-delay:-${rnd(0, 30).toFixed(0)}s;` +
      `animation-direction:alternate`);
  }
})();

(function carimbo() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById('carimbo').textContent =
    `[ ${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ]`;
})();

/* ---------- mascote ---------- */
// mensagem de sistema, não recado para o usuário: elogio e cutucão dão vergonha alheia
const FALAS = [
  'C:\\> defrag backlog', 'copiando 1 de 3...', '640K é memória suficiente',
  'roda em 800x600', 'não desligue o computador', 'pressione qualquer tecla',
  'nenhum vírus encontrado', 'disco rígido: 40 MB livres', 'reiniciando...',
  'conectando a 56 kbps', 'salvo em A:\\', 'modo de compatibilidade',
];
const mascote = document.getElementById('mascote');
const boneco = document.getElementById('boneco');
const fala = document.getElementById('fala');
let calaBoca = null;
let proximoRodopio = null;

function rodopiar() {
  boneco.classList.remove('rodando');
  void boneco.offsetWidth;                 // reinicia a animação
  boneco.classList.add('rodando');
}

function chamarMascote(texto, segundos = 4) {
  if (dados.mascote === false) return;
  rodopiar();
  fala.textContent = texto || FALAS[Math.floor(Math.random() * FALAS.length)];
  fala.classList.add('on');
  clearTimeout(calaBoca);
  calaBoca = setTimeout(() => fala.classList.remove('on'), segundos * 1000);
}

boneco.onclick = () => chamarMascote();

function pintarMascote() {
  const ligado = dados.mascote !== false;
  mascote.hidden = !ligado;
  document.getElementById('mascoteliga').textContent = ligado ? '🖥️ mascote' : '🖥️ mascote off';
  clearTimeout(proximoRodopio);
  if (!ligado) return;
  // ele fica sempre à vista; o rodopio é que vai e vem
  const ronda = () => {
    rodopiar();
    proximoRodopio = setTimeout(ronda, 25000 + Math.random() * 40000);
  };
  proximoRodopio = setTimeout(ronda, 12000);
}
document.getElementById('mascoteliga').onclick = () => {
  dados.mascote = dados.mascote === false;
  salvar(); pintarMascote();
};

/* ---------- tevê de gato ---------- */
const tv = document.getElementById('tv');
const gato = document.getElementById('gato');
const aviso = document.getElementById('aviso');
const chuvisco = document.getElementById('chuvisco');
const pincel = chuvisco.getContext('2d');
let canal = 0;
let relogioTv = null;
let ateChuvisco = 0;

let quadroRuido = null;
function pintarChuvisco() {
  const { width: w, height: h } = chuvisco;
  const quadro = quadroRuido || (quadroRuido = pincel.createImageData(w, h));
  const d = quadro.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 255 | 0;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = 255;
  }
  pincel.putImageData(quadro, 0, 0);
  // barra de rolagem vertical, como TV destravando o sincronismo
  pincel.fillStyle = 'rgba(255,255,255,.3)';
  pincel.fillRect(0, Math.random() * h | 0, w, 2 + Math.random() * 3);

  if (performance.now() < ateChuvisco) requestAnimationFrame(pintarChuvisco);
  else chuvisco.classList.remove('ligado');
}

function chiar(ms) {
  const primeiro = performance.now() >= ateChuvisco;
  ateChuvisco = performance.now() + ms;
  chuvisco.classList.add('ligado');
  if (primeiro) requestAnimationFrame(pintarChuvisco);
}

function trocarCanal() {
  chiar(520);
  gato.classList.remove('no-ar');
  aviso.textContent = '';
  setTimeout(() => {
    canal = canal % 99 + 1;
    document.getElementById('canal').textContent = 'CH ' + String(canal).padStart(2, '0');
    // cataas.com: gato aleatório de graça, sem chave. O parâmetro só fura o cache.
    gato.src = 'https://cataas.com/cat?' + Date.now() + Math.random();
  }, 300);
}

gato.onload = () => gato.classList.add('no-ar');
gato.onerror = () => { aviso.textContent = 'sem sinal'; chiar(1400); };
document.getElementById('tela').onclick = trocarCanal;

function ligarTv() {
  const ligada = dados.tv !== false;
  tv.hidden = !ligada;
  document.getElementById('tvliga').textContent = ligada ? '📺 tv' : '📺 tv off';
  clearInterval(relogioTv);
  if (!ligada) { gato.removeAttribute('src'); return; }
  if (!gato.getAttribute('src')) trocarCanal();
  relogioTv = setInterval(trocarCanal, 15000);
}
document.getElementById('tvliga').onclick = () => { dados.tv = dados.tv === false; salvar(); ligarTv(); };
document.getElementById('tvdesliga').onclick = () => { dados.tv = false; salvar(); ligarTv(); };

/* ---------- comemoração ---------- */
// placar de arcade, não elogio: em Jet Set Radio nada te parabeniza, te dá rank
const GRITOS = ['CLEAR!', 'TAGGED', 'FRESH', 'S-RANK', 'JET SET', 'NEXT!', 'RIDE ON'];
const TINTAS = ['#ff2e88', '#00d9ff', '#c6ff00', '#ff8a00', '#8b5cff'];
let combo = 0;
let ultimoFeito = 0;

function som() {
  if (dados.som === false) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;

    const sopro = (tipo, f0, f1, ini, dur, vol) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = tipo;
      o.frequency.setValueAtTime(f0, t + ini);
      o.frequency.exponentialRampToValueAtTime(f1, t + ini + dur);
      g.gain.setValueAtTime(.0001, t + ini);
      g.gain.exponentialRampToValueAtTime(vol, t + ini + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + ini + dur);
      o.connect(g).connect(audio.destination);
      o.start(t + ini);
      o.stop(t + ini + dur + .02);
    };

    // chiado de lata de spray
    const chiado = (ini, dur, vol) => {
      const n = Math.floor(audio.sampleRate * dur);
      const buf = audio.createBuffer(1, n, audio.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = audio.createBufferSource(); src.buffer = buf;
      const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 5400; f.Q.value = 1.1;
      const g = audio.createGain(); g.gain.value = vol;
      src.connect(f).connect(g).connect(audio.destination);
      src.start(t + ini);
    };

    // o combo sobe o tom, como contador de arcade
    const tom = Math.pow(2, Math.min(combo - 1, 7) / 12);
    chiado(0, .17, .12);
    sopro('sine', 90 * tom, 46 * tom, .02, .2, .3);                 // baque grave
    [415.3, 622.25, 830.6].forEach((f, i) =>                        // naipe de sopro
      sopro('square', f * tom, f * tom, .1 + i * .022, .26, .085));
  } catch {}
}

function festejar() {
  const palco = document.getElementById('palco');
  palco.innerHTML = '';

  const agora = Date.now();
  combo = agora - ultimoFeito < 7000 ? combo + 1 : 1;
  ultimoFeito = agora;
  som();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const tinta = TINTAS[Math.floor(Math.random() * TINTAS.length)];
  palco.style.setProperty('--cor', tinta);
  const { x, y } = ponteiro;
  const peca = (classe, estilo) => {
    const d = document.createElement('div');
    d.className = classe;
    d.style.cssText = estilo;
    palco.append(d);
    return d;
  };

  peca('flash', '');
  ['#ffffff', tinta, '#0b1b2a'].forEach((c, i) =>
    peca('onda', `left:${x}px;top:${y}px;color:${c};animation-delay:${i * 60}ms`));
  peca('raios', `left:${x}px;top:${y}px`);

  for (let i = 0; i < 34; i++) {
    const ang = Math.random() * Math.PI * 2;
    const dist = 140 + Math.random() * 340;
    const tam = 9 + Math.random() * 16;
    const tipo = i % 3 === 0 ? 'cd' : i % 3 === 1 ? 'estrela' : 'spray';
    peca('confete ' + tipo,
      `left:${x}px;top:${y}px;width:${tam}px;height:${tam}px;` +
      `--cor:${TINTAS[i % TINTAS.length]};` +
      `--dx:${(Math.cos(ang) * dist).toFixed(0)}px;--dy:${(Math.sin(ang) * dist - 60).toFixed(0)}px;` +
      `--r:${Math.round(Math.random() * 900 - 450)}deg;` +
      `animation-delay:${Math.round(Math.random() * 120)}ms`);
  }

  if (combo >= 3) chamarMascote('buffer overflow', 5);

  const grito = peca('slam', '');
  grito.textContent = GRITOS[Math.floor(Math.random() * GRITOS.length)];

  const placar = peca('placar-festa', '');
  const pontos = document.createElement('span');
  pontos.textContent = '+' + 100 * combo;
  placar.append(pontos);
  if (combo > 1) {
    const c = document.createElement('span');
    c.className = 'combo';
    c.textContent = combo + 'x COMBO';
    placar.append(c);
  }

  document.body.classList.add('tremendo');
  setTimeout(() => document.body.classList.remove('tremendo'), 620);
  setTimeout(() => { palco.innerHTML = ''; }, 1500);
}

/* ---------- projetos ---------- */
function campoChip(valor, aoConfirmar) {
  const i = document.createElement('input');
  let fechado = false;
  i.className = 'entrada';
  i.value = valor;
  i.placeholder = 'nome do projeto';
  const fechar = confirmar => {
    if (fechado) return;
    fechado = true;
    const v = i.value.trim();
    if (confirmar && v) aoConfirmar(v); else desenhar();
  };
  i.onkeydown = e => {
    if (e.key === 'Enter') fechar(true);
    if (e.key === 'Escape') fechar(false);
  };
  i.onblur = () => fechar(true);
  return i;
}

function desenharProjetos() {
  const alvo = document.getElementById('projetos');
  alvo.innerHTML = '';
  const pill = (rotulo, valor) => {
    const b = document.createElement('button');
    b.className = 'pill' + (dados.filtro === valor ? ' on' : '');
    b.textContent = rotulo;
    b.onclick = () => { dados.filtro = valor; salvar(); desenhar(); };
    return b;
  };
  alvo.append(pill('Todos', 'todos'));
  dados.projetos.forEach(p => alvo.append(pill(p.nome, p.id)));

  const add = document.createElement('button');
  add.className = 'pill novo';
  add.textContent = '+ projeto';
  add.onclick = () => {
    const campo = campoChip('', nome => {
      const p = { id: novoId(), nome };
      dados.projetos.push(p);
      dados.filtro = p.id;
      salvar(); desenhar();
    });
    add.replaceWith(campo);
    campo.focus();
  };
  alvo.append(add);

  /* título da faixa + ações do projeto ativo */
  const atual = dados.projetos.find(p => p.id === dados.filtro);
  document.getElementById('titulo').textContent = atual ? atual.nome : 'todos os projetos';

  const acoes = document.getElementById('acoes');
  acoes.innerHTML = '';
  if (!atual) return;

  const ren = document.createElement('button');
  ren.textContent = 'renomear';
  ren.onclick = () => {
    const campo = campoChip(atual.nome, nome => { atual.nome = nome; salvar(); desenhar(); });
    alvo.querySelector('.pill.on').replaceWith(campo);
    campo.focus(); campo.select();
  };

  const exc = document.createElement('button');
  exc.textContent = 'excluir';
  exc.onclick = () => {
    const n = dados.tarefas.filter(t => t.projeto === atual.id).length;
    if (!confirm(`Excluir "${atual.nome}" e suas ${n} tarefa(s)?`)) return;
    dados.projetos = dados.projetos.filter(p => p.id !== atual.id);
    dados.tarefas = dados.tarefas.filter(t => t.projeto !== atual.id);
    dados.filtro = 'todos';
    salvar(); desenhar();
  };

  acoes.append(ren, exc);
}

/* ---------- medidor ---------- */
function desenharMedidor() {
  const lista = visiveis();
  const widget = document.getElementById('widget');
  widget.hidden = !lista.length;
  if (!lista.length) return;

  const feitas = lista.filter(t => t.coluna === 'feito').length;
  const pct = feitas / lista.length;
  const celulas = document.getElementById('celulas');
  if (celulas.children.length !== CELULAS) {
    celulas.innerHTML = '';
    for (let i = 0; i < CELULAS; i++) {
      const c = document.createElement('i');
      c.style.setProperty('--i', i);
      celulas.append(c);
    }
  }
  const acesas = Math.round(pct * CELULAS);
  [...celulas.children].forEach((c, i) => c.classList.toggle('on', i < acesas));
  document.getElementById('placar').textContent =
    `${String(feitas).padStart(2, '0')} / ${String(lista.length).padStart(2, '0')} · ${Math.round(pct * 100)}%`;
}

/* ---------- quadro ---------- */
function desenharQuadro() {
  const quadro = document.getElementById('quadro');
  quadro.innerHTML = '';
  const todos = dados.filtro === 'todos';

  COLUNAS.forEach(([id, rotulo, ac], i) => {
    const tarefas = visiveis().filter(t => t.coluna === id);

    const col = document.createElement('section');
    col.className = 'coluna painel';
    col.dataset.coluna = id;
    col.style.setProperty('--ac', ac);
    col.innerHTML =
      `<h3><span class="indice">0${i + 1}</span>${rotulo}` +
      `<span class="risca"></span><span class="contador">${String(tarefas.length).padStart(2, '0')}</span></h3>`;

    if (id === 'feito' && tarefas.length) {
      const limpar = document.createElement('button');
      limpar.className = 'limpar';
      limpar.textContent = 'limpar';
      limpar.onclick = () => {
        if (!confirm(`Apagar ${tarefas.length} tarefa(s) concluída(s)?`)) return;
        const fora = new Set(tarefas.map(t => t.id));
        dados.tarefas = dados.tarefas.filter(t => !fora.has(t.id));
        salvar(); desenhar();
      };
      col.querySelector('h3').append(limpar);
    }

    if (!tarefas.length) {
      const vazio = document.createElement('p');
      vazio.className = 'vazio';
      vazio.textContent = '— vazio —';
      col.append(vazio);
    }

    tarefas.forEach((t, n) => col.append(cartao(t, i, todos, tarefas[n + 1] && tarefas[n + 1].id)));

    const nova = document.createElement('input');
    nova.className = 'nova';
    nova.placeholder = todos ? 'escolha um projeto' : '+ nova tarefa';
    nova.disabled = todos;
    nova.onkeydown = e => {
      if (e.key !== 'Enter' || !nova.value.trim()) return;
      dados.tarefas.push({ id: novoId(), projeto: dados.filtro, coluna: id, texto: nova.value.trim() });
      salvar(); desenhar();
      const campos = document.querySelectorAll('.nova');
      campos[i] && campos[i].focus();
    };
    col.append(nova);

    quadro.append(col);
  });
}

// decide onde o cartão vai cair a partir do que está sob o cursor
function mirar(x, y) {
  limparMarcas();
  document.querySelectorAll('.coluna.alvo').forEach(c => c.classList.remove('alvo'));
  destino = null;

  const sob = document.elementFromPoint(x, y);
  const col = sob && sob.closest('.coluna');
  if (!col) return;

  const cartaoAlvo = sob.closest('.cartao');
  if (cartaoAlvo && cartaoAlvo.dataset.id === arrastando) return;

  col.classList.add('alvo');
  destino = { coluna: col.dataset.coluna, antes: null };
  if (!cartaoAlvo) return;

  const r = cartaoAlvo.getBoundingClientRect();
  const emCima = y < r.top + r.height / 2;
  cartaoAlvo.classList.add(emCima ? 'solta-antes' : 'solta-depois');
  destino.antes = emCima ? cartaoAlvo.dataset.id : (cartaoAlvo.dataset.proximo || null);
}

function limparMarcas() {
  document.querySelectorAll('.solta-antes, .solta-depois')
    .forEach(e => e.classList.remove('solta-antes', 'solta-depois'));
}

function cartao(t, i, mostrarEtiqueta, proximo) {
  const el = document.createElement('article');
  el.className = 'cartao' + (t.coluna === 'feito' ? ' feito' : '');
  el.dataset.id = t.id;
  el.dataset.proximo = proximo || '';

  el.style.setProperty('--cor', cor(t.projeto));

  const corpo = document.createElement('div');
  corpo.className = 'texto';
  if (mostrarEtiqueta) {
    const p = dados.projetos.find(p => p.id === t.projeto);
    if (p) corpo.innerHTML = `<span class="etiqueta">${esc(p.nome)}</span>`;
  }
  const linha = document.createElement('span');
  linha.contentEditable = 'false';
  linha.textContent = t.texto;
  linha.onblur = () => {
    linha.contentEditable = 'false';
    const novo = linha.textContent.trim();
    if (!novo) { apagar(t.id); return; }
    if (novo !== t.texto) { t.texto = novo; salvar(); }
  };
  linha.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); linha.blur(); } };
  corpo.append(linha);

  const editar = () => {
    linha.contentEditable = 'true';
    linha.focus();
    const r = document.createRange();
    r.selectNodeContents(linha);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  };
  el.ondblclick = e => { if (!e.target.closest('button')) editar(); };

  const setas = document.createElement('div');
  setas.className = 'setas';
  setas.append(botao('✎', editar));
  if (i > 0) setas.append(botao('‹', () => mover(t.id, COLUNAS[i - 1][0])));
  if (i < COLUNAS.length - 1) setas.append(botao('›', () => mover(t.id, COLUNAS[i + 1][0])));
  const x = botao('×', () => apagar(t.id));
  x.className = 'x';
  setas.append(x);

  el.append(corpo, setas);

  el.onpointerdown = e => {
    if (e.button !== 0 || e.target.closest('button') || linha.isContentEditable) return;
    const ix = e.clientX, iy = e.clientY;
    let ativo = false, fantasma = null, dx = 0, dy = 0;
    let mx = ix, my = iy, miraPendente = false;

    const arrastar = ev => {
      if (!ativo) {
        // só vira arrasto depois de sair do lugar: um clique continua sendo clique
        if (Math.hypot(ev.clientX - ix, ev.clientY - iy) < 5) return;
        ativo = true;
        arrastando = t.id;
        const r = el.getBoundingClientRect();
        dx = ix - r.left;
        dy = iy - r.top;
        const clone = el.cloneNode(true);
        clone.classList.remove('arrastando', 'solta-antes', 'solta-depois');
        fantasma = document.createElement('div');
        fantasma.className = 'fantasma';
        fantasma.style.width = r.width + 'px';
        fantasma.append(clone);
        document.body.append(fantasma);
        el.classList.add('arrastando');
        document.body.classList.add('arrastando-agora');
      }
      fantasma.style.transform = `translate3d(${ev.clientX - dx}px, ${ev.clientY - dy}px, 0)`;
      // elementFromPoint + getBoundingClientRect forçam layout: no máximo um por quadro
      mx = ev.clientX; my = ev.clientY;
      if (!miraPendente) {
        miraPendente = true;
        requestAnimationFrame(() => { miraPendente = false; mirar(mx, my); });
      }
    };

    const largar = () => {
      document.removeEventListener('pointermove', arrastar);
      document.removeEventListener('pointerup', largar);
      if (!ativo) return;
      fantasma.remove();
      document.body.classList.remove('arrastando-agora');
      limparMarcas();
      document.querySelectorAll('.coluna.alvo').forEach(c => c.classList.remove('alvo'));
      if (destino) mover(arrastando, destino.coluna, destino.antes);
      arrastando = null;
      destino = null;
    };

    document.addEventListener('pointermove', arrastar);
    document.addEventListener('pointerup', largar);
  };

  return el;
}

function botao(rotulo, acao) {
  const b = document.createElement('button');
  b.textContent = rotulo;
  b.onclick = acao;
  return b;
}

function mover(id, coluna, antes) {
  if (antes === id) return;
  const i = dados.tarefas.findIndex(t => t.id === id);
  if (i < 0) return;
  const [t] = dados.tarefas.splice(i, 1);
  const concluiu = coluna === 'feito' && t.coluna !== 'feito';
  t.coluna = coluna;
  const j = antes ? dados.tarefas.findIndex(x => x.id === antes) : -1;
  if (j < 0) dados.tarefas.push(t); else dados.tarefas.splice(j, 0, t);
  salvar(); desenhar();
  if (concluiu) festejar();
}

function apagar(id) {
  dados.tarefas = dados.tarefas.filter(t => t.id !== id);
  salvar(); desenhar();
}

/* ---------- backup ---------- */
document.getElementById('exportar').onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `organizer-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

const botaoSom = document.getElementById('som');
function pintarSom() { botaoSom.textContent = dados.som === false ? '🔇 mudo' : '🔊 som'; }
botaoSom.onclick = () => { dados.som = dados.som === false; salvar(); pintarSom(); };

document.getElementById('importar').onclick = () => document.getElementById('arquivo').click();
document.getElementById('arquivo').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const lido = JSON.parse(await f.text());
    if (!Array.isArray(lido.projetos) || !Array.isArray(lido.tarefas)) throw 0;
    if (!confirm('Isso substitui tudo o que está salvo aqui. Continuar?')) return;
    dados = lido;
    salvar(); desenhar();
  } catch {
    alert('Arquivo inválido.');
  }
  e.target.value = '';
};

function desenhar() { desenharProjetos(); desenharMedidor(); desenharQuadro(); pintarSom(); }
desenhar();
ligarTv();
pintarMascote();
