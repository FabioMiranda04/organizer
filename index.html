<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9dcf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Organizer">
<title>Organizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='28%25'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='.45' stop-color='%235fd0f5'/%3E%3Cstop offset='1' stop-color='%230a6ea6'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Cellipse cx='12' cy='10' rx='7' ry='4.5' fill='%23ffffff' opacity='.75'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #0c3549;
    --tinta-fraca: #4d7f99;
    --aqua-claro: #7fe0ff;
    --aqua: #14a5e2;
    --aqua-fundo: #0a6ea6;
    --verde: #3fbf85;
    --ambar: #f0a63a;
    --vidro: rgba(255, 255, 255, .5);
    --borda: rgba(255, 255, 255, .8);
    --sombra: 0 14px 34px rgba(8, 62, 94, .18);
    --gloss: inset 0 1px 0 rgba(255, 255, 255, .95);
    --raio: 18px;
    --fonte: "Titillium Web", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background-color: #9fd8f2;
    background-image:
      radial-gradient(130% 70% at 50% 104%, #c6f6e0 0%, rgba(198, 246, 224, 0) 62%),
      linear-gradient(180deg, #2b9cdd 0%, #5cbcec 16%, #93d5f5 40%, #c3ebfa 66%, #e2f8ef 100%);
  }
  body {
    min-height: 100vh;
    margin: 0;
    color: var(--tinta);
    font: 15px/1.45 var(--fonte);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  /* ---------- bolhas do fundo ---------- */
  .ceu { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .ceu i {
    position: absolute; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,1) 0%, rgba(255,255,255,.5) 16%, rgba(255,255,255,0) 34%),
      radial-gradient(circle at 72% 80%, rgba(255,255,255,.75), rgba(255,255,255,0) 42%),
      radial-gradient(circle at 50% 50%, rgba(150, 240, 255, .38), rgba(70, 190, 240, .3) 68%, rgba(255,255,255,.55) 100%);
    box-shadow: inset 0 0 22px rgba(255,255,255,.75), 0 0 24px rgba(255,255,255,.35);
    border: 1px solid rgba(255,255,255,.5);
    animation: subir linear infinite;
  }
  .ceu i:nth-child(1) { width: 190px; height: 190px; left: 6%;  top: 62%; animation-duration: 26s; }
  .ceu i:nth-child(2) { width: 90px;  height: 90px;  left: 24%; top: 80%; animation-duration: 19s; animation-delay: -6s; }
  .ceu i:nth-child(3) { width: 260px; height: 260px; left: 70%; top: 70%; animation-duration: 34s; animation-delay: -12s; }
  .ceu i:nth-child(4) { width: 60px;  height: 60px;  left: 52%; top: 88%; animation-duration: 15s; animation-delay: -3s; }
  .ceu i:nth-child(5) { width: 130px; height: 130px; left: 88%; top: 40%; animation-duration: 29s; animation-delay: -18s; }
  .ceu b {
    position: absolute; border-radius: 50%; filter: blur(70px); opacity: .3;
  }
  .ceu b:nth-child(6) { width: 420px; height: 420px; left: -8%; top: -14%; background: #6fe3ff; }
  .ceu b:nth-child(7) { width: 380px; height: 380px; right: -6%; top: 4%;  background: #8df0c4; }
  @keyframes subir {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(28px, -115vh, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .ceu i { animation: none; } }

  /* ---------- casca ---------- */
  .folha { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; }

  .vidro {
    background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.42));
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    box-shadow: var(--sombra), var(--gloss);
  }

  /* ---------- cabeçalho ---------- */
  header { position: relative; overflow: hidden; padding: 16px 18px; }
  header::after {
    content: ''; position: absolute; right: -6%; top: -170%;
    width: 52%; height: 240%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,0));
  }
  .topo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .marca { display: flex; align-items: center; gap: 10px; }
  .marca svg { width: 30px; height: 30px; filter: drop-shadow(0 3px 5px rgba(10,80,120,.35)); }
  h1 {
    margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -.02em; line-height: 1;
    background: linear-gradient(180deg, #f2fbff 0%, #7cc6ec 22%, #0a5f92 46%, #073f61 56%, #2a94cd 76%, #bfe9ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: .6px rgba(7, 62, 95, .45);
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.85)) drop-shadow(0 3px 5px rgba(8,60,92,.3));
  }
  .lema { color: var(--tinta-fraca); font-size: 13px; font-weight: 300; }
  .backup { margin-left: auto; display: flex; gap: 8px; }

  .botao {
    padding: 7px 15px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--aqua-fundo);
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(226,244,253,.75));
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 4px 10px rgba(10,80,120,.16), inset 0 1px 0 #fff, inset 0 -6px 10px rgba(180,225,245,.35);
    transition: transform .14s, box-shadow .14s;
  }
  .botao:hover { transform: translateY(-1px); box-shadow: 0 7px 16px rgba(10,80,120,.22), inset 0 1px 0 #fff; }
  .botao:active { transform: translateY(1px); }

  /* ---------- projetos ---------- */
  .projetos { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .chip {
    position: relative; overflow: hidden;
    padding: 7px 15px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap;
    color: #1c5b78;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(214,238,250,.62));
    border: 1px solid rgba(255,255,255,.85);
    box-shadow: 0 3px 8px rgba(10,80,120,.14), inset 0 1px 0 #fff;
    transition: transform .14s, box-shadow .14s, color .14s;
  }
  .chip::after {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 52%;
    background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.05));
    border-radius: 999px 999px 60% 60% / 999px 999px 18px 18px;
    pointer-events: none;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip.ativo {
    color: #fff; text-shadow: 0 1px 1px rgba(6,60,90,.5);
    background: linear-gradient(180deg, var(--aqua-claro) 0%, var(--aqua) 46%, #0d8fc9 54%, var(--aqua-fundo) 100%);
    border-color: rgba(255,255,255,.65);
    box-shadow: 0 5px 13px rgba(10,110,165,.38), inset 0 1px 0 rgba(255,255,255,.85), inset 0 -8px 12px rgba(4,70,110,.3);
  }
  .chip.novo { border-style: dashed; color: #3d7c9b; font-weight: 400; }
  .chip.entrada { outline: none; width: 150px; background: #fff; color: var(--tinta); font-weight: 600; }
  .chip.entrada::after { display: none; }
  .acoes { display: flex; gap: 10px; margin-left: 2px; }
  .acoes button { font-size: 12px; font-weight: 300; color: #46829e; text-decoration: underline; text-underline-offset: 3px; }
  .acoes button:hover { color: var(--aqua-fundo); }

  /* ---------- progresso ---------- */
  .progresso { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .trilho {
    flex: 1; height: 14px; border-radius: 999px; overflow: hidden;
    background: linear-gradient(180deg, rgba(9,58,86,.16), rgba(255,255,255,.34));
    border: 1px solid rgba(255,255,255,.75);
    box-shadow: inset 0 2px 5px rgba(8,60,90,.25);
  }
  .preenche {
    position: relative; height: 100%; border-radius: 999px;
    background: linear-gradient(180deg, #bff7dd 0%, #59d69c 44%, #2fb579 54%, #17916a 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 0 10px rgba(45,190,130,.55);
    transition: width .35s cubic-bezier(.3, 1, .4, 1);
  }
  .preenche::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.32) 0 9px, rgba(255,255,255,0) 9px 20px);
    animation: correr 1.1s linear infinite;
  }
  @keyframes correr { to { background-position: 20px 0; } }
  @media (prefers-reduced-motion: reduce) { .preenche::after { animation: none; } }
  .placar { font-size: 12px; font-weight: 600; color: #2b6c8b; white-space: nowrap; }

  /* ---------- quadro ---------- */
  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 16px; align-items: start; }
  .coluna { padding: 12px; min-height: 210px; transition: box-shadow .18s, border-color .18s; }
  .coluna.alvo {
    border-color: rgba(255,255,255,1);
    box-shadow: 0 0 0 3px rgba(20,165,226,.45), 0 18px 40px rgba(8,62,94,.25), var(--gloss);
  }
  .coluna h2 {
    display: flex; align-items: center; gap: 8px;
    margin: 2px 2px 12px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .1em; color: #2b6c8b;
  }
  .marcador {
    width: 10px; height: 10px; border-radius: 50%; background: var(--ac);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 0 8px var(--ac);
  }
  .contador {
    padding: 1px 8px; border-radius: 999px; font-size: 11px; letter-spacing: 0;
    color: #1c5b78;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(206,234,248,.7));
    box-shadow: inset 0 1px 0 #fff, 0 1px 3px rgba(10,80,120,.18);
  }
  .limpar { margin-left: auto; font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; color: #46829e; text-decoration: underline; text-underline-offset: 3px; }
  .limpar:hover { color: var(--aqua-fundo); }

  .cartao {
    position: relative; display: flex; align-items: flex-start; gap: 8px;
    padding: 11px 12px; margin-bottom: 9px; border-radius: 13px; cursor: grab;
    background: linear-gradient(180deg, #ffffff 0%, #f2fbff 52%, #e4f4fd 100%);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 5px 14px rgba(10,72,108,.16), inset 0 1px 0 #fff;
    transition: transform .16s, box-shadow .16s;
  }
  .cartao::before {
    content: ''; position: absolute; left: 1px; right: 1px; top: 1px; height: 48%;
    border-radius: 12px 12px 50% 50% / 12px 12px 16px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.15));
    pointer-events: none;
  }
  .cartao:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(10,72,108,.22), inset 0 1px 0 #fff; }
  .cartao.arrastando { opacity: .45; }
  .cartao > * { position: relative; }
  .cartao .texto { flex: 1; word-break: break-word; }
  .cartao .texto span[contenteditable] { outline: none; display: block; }
  .cartao .texto span[contenteditable]:focus { color: #06283a; }
  .cartao.feito { background: linear-gradient(180deg, #ffffff 0%, #f1fbf5 55%, #dff5e8 100%); }
  .cartao.feito .texto span[contenteditable] { color: #5c8a79; text-decoration: line-through; }

  .etiqueta {
    display: inline-block; margin-bottom: 5px; padding: 1px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.28);
    background: linear-gradient(180deg, color-mix(in srgb, var(--cor) 65%, #fff), var(--cor) 52%, color-mix(in srgb, var(--cor) 75%, #000));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 5px rgba(10,72,108,.22);
  }

  .setas { display: flex; flex-direction: column; gap: 3px; opacity: 0; transition: opacity .16s; }
  .cartao:hover .setas, .cartao:focus-within .setas { opacity: 1; }
  .setas button {
    width: 21px; height: 21px; border-radius: 50%; font-size: 12px; line-height: 1; color: #2b6c8b;
    background: linear-gradient(180deg, #fff, #dceffb);
    box-shadow: inset 0 1px 0 #fff, 0 2px 4px rgba(10,80,120,.2);
  }
  .setas button:hover { color: #fff; background: linear-gradient(180deg, var(--aqua-claro), var(--aqua-fundo)); }
  .vazio { color: #5f92ab; font-size: 13px; font-weight: 300; padding: 4px 3px 12px; }

  .nova {
    width: 100%; padding: 10px 14px; border-radius: 999px; color: var(--tinta);
    background: rgba(255,255,255,.62);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: inset 0 2px 5px rgba(8,60,90,.12);
    transition: box-shadow .16s, background .16s;
  }
  .nova::placeholder { color: #6d9db5; font-weight: 300; }
  .nova:focus {
    outline: none; background: #fff;
    box-shadow: 0 0 0 3px rgba(20,165,226,.35), inset 0 2px 4px rgba(8,60,90,.1);
  }
  .nova:disabled { opacity: .55; cursor: not-allowed; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .setas { opacity: 1; flex-direction: row; }
    h1 { font-size: 24px; }
    .folha { padding: 12px 12px 40px; }
  }
</style>
</head>
<body>

<div class="ceu" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b><b></b></div>

<div class="folha">
  <header class="vidro">
    <div class="topo">
      <div class="marca">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs><radialGradient id="orb" cx="35%" cy="28%">
            <stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#5fd0f5"/><stop offset="1" stop-color="#0a6ea6"/>
          </radialGradient></defs>
          <circle cx="16" cy="16" r="14" fill="url(#orb)"/>
          <ellipse cx="12" cy="10" rx="7" ry="4.5" fill="#fff" opacity=".72"/>
        </svg>
        <h1>Organizer</h1>
      </div>
      <span class="lema">backlog dos meus projetos</span>
      <div class="backup">
        <button class="botao" id="exportar">exportar</button>
        <button class="botao" id="importar">importar</button>
      </div>
    </div>
    <div class="projetos" id="projetos"></div>
    <div class="progresso" id="progresso" hidden>
      <div class="trilho"><div class="preenche" id="preenche"></div></div>
      <span class="placar" id="placar"></span>
    </div>
  </header>

  <main id="quadro"></main>
</div>

<input type="file" id="arquivo" accept="application/json" hidden>

<script>
const CHAVE = 'organizer.kanban.v1';
const COLUNAS = [
  ['backlog', 'Backlog', '#3aa9e0'],
  ['fazendo', 'Fazendo', '#f0a63a'],
  ['feito',   'Feito',   '#3fbf85'],
];

let dados = carregar();
let arrastando = null;

function carregar() {
  try {
    const bruto = JSON.parse(localStorage.getItem(CHAVE));
    if (bruto && Array.isArray(bruto.projetos)) return bruto;
  } catch {}
  const id = novoId();
  return { projetos: [{ id, nome: 'Geral' }], tarefas: [], filtro: id };
}

function salvar() { localStorage.setItem(CHAVE, JSON.stringify(dados)); }
function novoId() { return Math.random().toString(36).slice(2, 10); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function cor(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 68% 52%)`;
}
function visiveis() {
  return dados.filtro === 'todos' ? dados.tarefas : dados.tarefas.filter(t => t.projeto === dados.filtro);
}

/* ---------- projetos ---------- */
function campoChip(valor, aoConfirmar) {
  const i = document.createElement('input');
  let fechado = false;
  i.className = 'chip entrada';
  i.value = valor;
  i.placeholder = 'nome do projeto';
  const fechar = confirmar => {
    if (fechado) return;
    fechado = true;
    const v = i.value.trim();
    if (confirmar && v) aoConfirmar(v); else desenhar();
  };
  i.onkeydown = e => {
    if (e.key === 'Enter') fechar(true);
    if (e.key === 'Escape') fechar(false);
  };
  i.onblur = () => fechar(true);
  return i;
}

function desenharProjetos() {
  const alvo = document.getElementById('projetos');
  alvo.innerHTML = '';
  const chip = (rotulo, valor) => {
    const b = document.createElement('button');
    b.className = 'chip' + (dados.filtro === valor ? ' ativo' : '');
    b.textContent = rotulo;
    b.onclick = () => { dados.filtro = valor; salvar(); desenhar(); };
    return b;
  };
  alvo.append(chip('Todos', 'todos'));
  dados.projetos.forEach(p => alvo.append(chip(p.nome, p.id)));

  const add = document.createElement('button');
  add.className = 'chip novo';
  add.textContent = '+ projeto';
  add.onclick = () => {
    const campo = campoChip('', nome => {
      const p = { id: novoId(), nome };
      dados.projetos.push(p);
      dados.filtro = p.id;
      salvar(); desenhar();
    });
    add.replaceWith(campo);
    campo.focus();
  };
  alvo.append(add);

  const atual = dados.projetos.find(p => p.id === dados.filtro);
  if (!atual) return;

  const caixa = document.createElement('div');
  caixa.className = 'acoes';

  const ren = document.createElement('button');
  ren.textContent = 'renomear';
  ren.onclick = () => {
    const chips = alvo.querySelectorAll('.chip.ativo');
    const campo = campoChip(atual.nome, nome => { atual.nome = nome; salvar(); desenhar(); });
    chips[0].replaceWith(campo);
    campo.focus(); campo.select();
  };

  const exc = document.createElement('button');
  exc.textContent = 'excluir';
  exc.onclick = () => {
    const n = dados.tarefas.filter(t => t.projeto === atual.id).length;
    if (!confirm(`Excluir "${atual.nome}" e suas ${n} tarefa(s)?`)) return;
    dados.projetos = dados.projetos.filter(p => p.id !== atual.id);
    dados.tarefas = dados.tarefas.filter(t => t.projeto !== atual.id);
    dados.filtro = 'todos';
    salvar(); desenhar();
  };

  caixa.append(ren, exc);
  alvo.append(caixa);
}

/* ---------- progresso ---------- */
function desenharProgresso() {
  const lista = visiveis();
  const feitas = lista.filter(t => t.coluna === 'feito').length;
  const barra = document.getElementById('progresso');
  barra.hidden = !lista.length;
  if (!lista.length) return;
  document.getElementById('preenche').style.width = Math.round(feitas / lista.length * 100) + '%';
  document.getElementById('placar').textContent = `${feitas} de ${lista.length} feitas`;
}

/* ---------- quadro ---------- */
function desenharQuadro() {
  const quadro = document.getElementById('quadro');
  quadro.innerHTML = '';
  const todos = dados.filtro === 'todos';

  COLUNAS.forEach(([id, rotulo, ac], i) => {
    const tarefas = visiveis().filter(t => t.coluna === id);

    const col = document.createElement('section');
    col.className = 'coluna vidro';
    col.style.setProperty('--ac', ac);
    col.innerHTML = `<h2><span class="marcador"></span>${rotulo}<span class="contador">${tarefas.length}</span></h2>`;

    if (id === 'feito' && tarefas.length) {
      const limpar = document.createElement('button');
      limpar.className = 'limpar';
      limpar.textContent = 'limpar';
      limpar.onclick = () => {
        if (!confirm(`Apagar ${tarefas.length} tarefa(s) concluída(s)?`)) return;
        const fora = new Set(tarefas.map(t => t.id));
        dados.tarefas = dados.tarefas.filter(t => !fora.has(t.id));
        salvar(); desenhar();
      };
      col.querySelector('h2').append(limpar);
    }

    if (!tarefas.length) {
      const vazio = document.createElement('p');
      vazio.className = 'vazio';
      vazio.textContent = 'Nada aqui.';
      col.append(vazio);
    }

    tarefas.forEach(t => col.append(cartao(t, i, todos)));

    const nova = document.createElement('input');
    nova.className = 'nova';
    nova.placeholder = todos ? 'escolha um projeto para adicionar' : '+ nova tarefa';
    nova.disabled = todos;
    nova.onkeydown = e => {
      if (e.key !== 'Enter' || !nova.value.trim()) return;
      dados.tarefas.push({ id: novoId(), projeto: dados.filtro, coluna: id, texto: nova.value.trim() });
      salvar(); desenhar();
      const campos = document.querySelectorAll('.nova');
      campos[i] && campos[i].focus();
    };
    col.append(nova);

    col.ondragover = e => { e.preventDefault(); col.classList.add('alvo'); };
    col.ondragleave = () => col.classList.remove('alvo');
    col.ondrop = e => { e.preventDefault(); col.classList.remove('alvo'); mover(arrastando, id); };

    quadro.append(col);
  });
}

function cartao(t, i, mostrarEtiqueta) {
  const el = document.createElement('article');
  el.className = 'cartao' + (t.coluna === 'feito' ? ' feito' : '');
  el.draggable = true;

  const corpo = document.createElement('div');
  corpo.className = 'texto';
  if (mostrarEtiqueta) {
    const p = dados.projetos.find(p => p.id === t.projeto);
    if (p) corpo.innerHTML = `<span class="etiqueta" style="--cor:${cor(p.id)}">${esc(p.nome)}</span>`;
  }
  const linha = document.createElement('span');
  linha.contentEditable = 'true';
  linha.textContent = t.texto;
  linha.onblur = () => {
    const novo = linha.textContent.trim();
    if (!novo) { apagar(t.id); return; }
    if (novo !== t.texto) { t.texto = novo; salvar(); }
  };
  linha.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); linha.blur(); } };
  corpo.append(linha);

  const setas = document.createElement('div');
  setas.className = 'setas';
  if (i > 0) setas.append(botao('‹', () => mover(t.id, COLUNAS[i - 1][0])));
  if (i < COLUNAS.length - 1) setas.append(botao('›', () => mover(t.id, COLUNAS[i + 1][0])));
  setas.append(botao('×', () => apagar(t.id)));

  el.append(corpo, setas);
  el.ondragstart = () => { arrastando = t.id; el.classList.add('arrastando'); };
  el.ondragend = () => el.classList.remove('arrastando');
  return el;
}

function botao(rotulo, acao) {
  const b = document.createElement('button');
  b.textContent = rotulo;
  b.onclick = acao;
  return b;
}

function mover(id, coluna) {
  const t = dados.tarefas.find(t => t.id === id);
  if (!t || t.coluna === coluna) return;
  t.coluna = coluna;
  dados.tarefas = dados.tarefas.filter(x => x !== t).concat(t);
  salvar(); desenhar();
}

function apagar(id) {
  dados.tarefas = dados.tarefas.filter(t => t.id !== id);
  salvar(); desenhar();
}

/* ---------- backup ---------- */
document.getElementById('exportar').onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `organizer-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('importar').onclick = () => document.getElementById('arquivo').click();
document.getElementById('arquivo').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const lido = JSON.parse(await f.text());
    if (!Array.isArray(lido.projetos) || !Array.isArray(lido.tarefas)) throw 0;
    if (!confirm('Isso substitui tudo o que está salvo aqui. Continuar?')) return;
    dados = lido;
    salvar(); desenhar();
  } catch {
    alert('Arquivo inválido.');
  }
  e.target.value = '';
};

function desenhar() { desenharProjetos(); desenharProgresso(); desenharQuadro(); }
desenhar();
</script>
