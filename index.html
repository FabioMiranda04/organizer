<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1220">
<meta name="theme-color" content="#dcecf8">
<title>Organizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='h' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb3e6'/%3E%3Cstop offset='.4' stop-color='%238ecbff'/%3E%3Cstop offset='.75' stop-color='%239df5e4'/%3E%3Cstop offset='1' stop-color='%23fff0a8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23h)'/%3E%3Cpath d='M16 3C17 11 21 15 29 16 21 17 17 21 16 29 15 21 11 17 3 16 11 15 15 11 16 3Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito+Sans:wght@400;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #123249;
    --tinta-fraca: #5b83a0;
    --aco: #7ba8c6;
    --borda: #b9d6ea;
    --borda-forte: #8dbcdc;
    --azul: #2b7fc0;
    --menta: #35b58a;
    --rosa: #e0559c;
    --papel: #ffffff;
    --raio: 12px;
    --holo: linear-gradient(115deg, #ffb3e6, #c8a8ff, #8ecbff, #9df5e4, #fff0a8, #ffb3e6);
    --holo-forte: linear-gradient(115deg, #ff5ec4, #9b6bff, #34a8ff, #22e6b0, #ffd447, #ff5ec4);
    --sans: "Nunito Sans", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    /* fonte de pixel só em rótulo fixo: ela não tem acento */
    --pixel: "Silkscreen", ui-monospace, Consolas, monospace;
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  }
  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background:
      radial-gradient(72% 48% at 80% -4%, rgba(255,255,255,.95), rgba(255,255,255,0) 62%),
      radial-gradient(64% 46% at 6% 104%, rgba(178,224,255,.85), rgba(255,255,255,0) 66%),
      linear-gradient(180deg, #c9e3f7 0%, #e9f4fc 42%, #d9ebf8 100%);
  }
  body {
    margin: 0; min-width: 1220px;
    color: var(--tinta);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }

  /* ---------- utilidades y2k ---------- */
  .holo, .iris {
    background: var(--holo);
    background-size: 340% 340%;
    animation: iris 16s ease-in-out infinite;
  }
  @keyframes iris {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  .barcode {
    width: 86px; height: 20px; flex: none;
    background: repeating-linear-gradient(90deg,
      #1b3a52 0 1px, transparent 1px 3px, #1b3a52 3px 5px, transparent 5px 6px,
      #1b3a52 6px 8px, transparent 8px 11px, #1b3a52 11px 12px, transparent 12px 14px);
    opacity: .8;
  }
  .pixels { display: flex; gap: 2px; }
  .pixels i { width: 4px; height: 4px; background: var(--aco); }
  .pixels i:nth-child(3n) { background: var(--rosa); }
  .pixels i:nth-child(4n) { background: var(--azul); opacity: .6; }
  .hud, .contador, .placar, .indice {
    font-variant-numeric: tabular-nums;
  }
  .hud {
    font: 400 9px/1 var(--pixel); letter-spacing: .18em;
    text-transform: uppercase; color: var(--tinta-fraca);
  }

  /* botão pill envidraçado (aqua) */
  .pill {
    position: relative; overflow: hidden;
    padding: 8px 20px 9px; border-radius: 999px;
    font: 500 13px/1 var(--sans); color: #17567f; white-space: nowrap;
    background: linear-gradient(180deg, #f6fcff 0%, #d5eefc 46%, #a9d8f4 52%, #cfeaff 100%);
    border: 1px solid #86bede;
    box-shadow: 0 3px 6px rgba(30,90,130,.2), inset 0 1px 0 #fff, inset 0 -7px 10px rgba(150,205,235,.4);
    transition: transform .13s, box-shadow .13s, filter .13s;
  }
  .pill::after {
    content: ''; position: absolute; left: 4%; right: 4%; top: 2px; height: 42%;
    border-radius: 999px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.15));
  }
  .pill:hover { transform: translateY(-1px); filter: brightness(1.04); }
  .pill:active { transform: translateY(1px); }
  .pill.on {
    color: #14324a; border-color: #fff;
    background: var(--holo); background-size: 340% 340%;
    animation: iris 16s ease-in-out infinite;
    box-shadow: 0 4px 12px rgba(120,70,180,.3), inset 0 1px 0 rgba(255,255,255,.9);
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
  }

  /* ---------- casca ---------- */
  .folha { width: 1180px; margin: 0 auto; padding: 24px 0 40px; }
  .painel {
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    box-shadow: 0 10px 26px rgba(30,90,130,.13), inset 0 1px 0 #fff;
  }

  /* ---------- banner ---------- */
  .banner {
    display: flex; overflow: hidden; padding: 0;
    box-shadow: 0 18px 40px rgba(30,90,130,.18), inset 0 1px 0 #fff;
  }
  .banner .esq { flex: 1; padding: 22px 24px 18px; }
  .marca { display: flex; align-items: flex-start; gap: 10px; }
  h1 {
    margin: 0; font: 400 58px/.9 var(--display); letter-spacing: -.02em;
    background: linear-gradient(180deg,
      #ffffff 0%, #dceefb 9%, #a9c8de 23%, #2f5772 41%,
      #0b2233 50%, #4a7b99 55%, #dff2ff 63%, #ffffff 70%,
      #b9d3e4 84%, #5f88a3 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1.4px rgba(20, 60, 90, .6);
    filter: drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 6px 12px rgba(30,80,120,.3));
  }
  .marca .estrela { width: 26px; height: 26px; margin-top: 4px; }
  .sub { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .sub .linha { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--borda-forte) 0 3px, transparent 3px 7px); }
  .lema { font: 400 11px/1 var(--pixel); letter-spacing: .3em; text-transform: uppercase; color: var(--tinta-fraca); }
  .banner .backup { margin-top: 18px; display: flex; align-items: center; gap: 8px; }
  .banner .backup .hud { margin-left: auto; }

  .vitrine {
    position: relative; width: 400px; flex: none; overflow: hidden;
    border-left: 1px solid var(--borda);
    background: linear-gradient(180deg, #bfe2fa, #eaf6ff 60%, #dff0fd);
  }
  .vitrine .blob {
    position: absolute; left: 16%; top: 12%; width: 240px; height: 170px;
    border-radius: 62% 38% 46% 54% / 54% 62% 38% 46%;
    filter: blur(.4px);
    box-shadow: inset 0 -18px 34px rgba(255,255,255,.75), inset 0 14px 30px rgba(90,40,140,.28),
                0 14px 30px rgba(80,60,140,.28);
  }
  .vitrine .blob::after {
    content: ''; position: absolute; left: 16%; top: 12%; width: 40%; height: 26%;
    border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.1));
  }
  .vitrine .bolha {
    position: absolute; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 26%, rgba(255,255,255,1) 0 8%, rgba(255,255,255,.35) 22%, rgba(255,255,255,0) 42%),
      radial-gradient(circle at 68% 76%, rgba(255,200,245,.6), rgba(160,220,255,.35) 55%, rgba(255,255,255,.2) 100%);
    box-shadow: inset 0 0 14px rgba(255,255,255,.85), 0 6px 14px rgba(70,120,160,.25);
  }
  .vitrine .grade { position: absolute; right: -34px; bottom: -46px; width: 190px; opacity: .5; }
  .vitrine .flare {
    position: absolute; left: 24%; top: 22%; width: 200px; height: 200px;
    transform: translate(-50%, -50%); pointer-events: none;
    background:
      radial-gradient(circle, rgba(255,255,255,.95) 0 3%, rgba(255,255,255,0) 26%),
      linear-gradient(90deg, rgba(255,255,255,0) 6%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 94%) center/100% 2px no-repeat,
      linear-gradient(180deg, rgba(255,255,255,0) 18%, rgba(255,255,255,.6) 50%, rgba(255,255,255,0) 82%) center/2px 100% no-repeat;
  }
  .cintila { animation: cintilar 3.4s ease-in-out infinite; transform-origin: center; }
  @keyframes cintilar { 0%, 100% { opacity: .95; transform: scale(1); } 50% { opacity: .45; transform: scale(.82); } }
  @media (prefers-reduced-motion: reduce) {
    .holo, .iris, .pill.on, .cintila, .cartao::before { animation: none; }
  }

  /* ---------- barra de projetos ---------- */
  .barra {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding: 12px 14px;
    background: linear-gradient(180deg, #ffffff, #e9f4fc);
  }
  .projetos { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .pill.novo {
    background: #f3f9fd; border-style: dashed; border-color: var(--borda-forte);
    color: var(--tinta-fraca); font-size: 12px; padding: 8px 15px 9px;
  }
  .pill.novo::after { display: none; }
  .entrada {
    padding: 8px 14px; border-radius: 999px; width: 190px;
    border: 1px solid var(--azul); background: #fff; outline: none;
    font: 500 13px/1 var(--sans);
  }
  .acoes { display: flex; gap: 10px; }
  .acoes button {
    font: 400 9px/1 var(--pixel); letter-spacing: .18em; text-transform: uppercase;
    color: var(--tinta-fraca); border-bottom: 1px solid var(--borda-forte); padding-bottom: 2px;
  }
  .acoes button:hover { color: var(--azul); border-color: var(--azul); }

  /* widget de progresso, no espírito do "playing : song" */
  .widget {
    margin-left: auto; flex: none; width: 232px;
    border: 1px solid var(--borda-forte); border-radius: 5px; overflow: hidden;
    background: #f7fbfe;
    box-shadow: inset 0 1px 3px rgba(60,110,150,.16);
  }
  .widget .cima {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px; border-bottom: 1px solid #dbebf6;
    background: linear-gradient(180deg, #fff, #eaf4fb);
  }
  .widget .placar { font: 500 10px/1 var(--pixel); color: var(--azul); }
  .celulas { display: flex; gap: 2px; padding: 6px 8px 7px; }
  .celulas i {
    flex: 1; height: 10px; border-radius: 1px;
    background: #e3eef6; box-shadow: inset 0 1px 0 #fff;
  }
  .celulas i.on {
    background-image: var(--holo-forte);
    background-size: 2400% 100%;
    background-position: calc(var(--i) * 4.35%) 50%;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 0 6px rgba(150,120,255,.35);
  }

  /* ---------- faixa de título ---------- */
  .faixa { display: flex; align-items: center; gap: 12px; margin: 20px 2px 12px; }
  .seta {
    width: 54px; height: 12px; flex: none;
    background: linear-gradient(90deg, var(--azul), #9fd0ee);
    clip-path: polygon(0 40%, 62% 40%, 62% 0, 100% 50%, 62% 100%, 62% 60%, 0 60%);
    opacity: .75;
  }
  .faixa h2 {
    margin: 0; font: 700 21px/1 var(--sans); letter-spacing: -.01em; color: #245a80;
  }
  .faixa .diamante { width: 11px; height: 11px; transform: rotate(45deg); background: var(--holo-forte); background-size: 300% 300%; animation: iris 16s ease-in-out infinite; border: 1px solid #fff; }
  .faixa .linha { flex: 1; height: 3px; background: linear-gradient(90deg, var(--borda-forte), rgba(185,214,234,0)); border-radius: 2px; }

  /* ---------- quadro ---------- */
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
  .coluna {
    padding: 14px; min-height: 260px;
    box-shadow: 0 3px 10px rgba(30,90,130,.08), inset 0 1px 0 #fff;
    transition: border-color .16s, box-shadow .16s;
  }
  .coluna.alvo {
    border-color: var(--azul); border-style: dashed;
    box-shadow: 0 0 0 3px rgba(43,127,192,.16), 0 10px 26px rgba(30,90,130,.16);
  }
  .coluna { overflow: hidden; }
  .coluna h3 {
    display: flex; align-items: center; gap: 8px;
    margin: -14px -14px 12px; padding: 11px 13px;
    background: linear-gradient(180deg, #fbfdff, #e4f1fb);
    border-bottom: 1px solid var(--borda);
    font: 700 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #245a80;
  }
  .indice { font: 400 11px/1 var(--pixel); color: #fff; background: var(--ac); padding: 3px 5px; border-radius: 3px; }
  .risca { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--borda) 0 3px, transparent 3px 6px); }
  .contador { font: 500 11px/1 var(--pixel); color: var(--tinta-fraca); }
  .limpar {
    font: 400 9px/1 var(--pixel); letter-spacing: .16em; text-transform: uppercase;
    color: var(--tinta-fraca); border-bottom: 1px solid var(--borda-forte); padding-bottom: 2px;
  }
  .limpar:hover { color: var(--rosa); border-color: var(--rosa); }

  .cartao {
    position: relative; display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 11px 11px 14px; margin-bottom: 8px; border-radius: 9px; cursor: grab;
    background: linear-gradient(180deg, #ffffff, #f4fafe);
    border: 1px solid #d8e9f4;
    box-shadow: 0 2px 5px rgba(40,100,140,.1), inset 0 1px 0 #fff;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .cartao::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    border-radius: 9px 0 0 9px;
    background: var(--holo-forte);
    animation: matiz 9s linear infinite;
  }
  @keyframes matiz { to { filter: hue-rotate(360deg); } }
  .cartao:hover {
    transform: translateY(-2px);
    border-color: var(--borda-forte);
    box-shadow: 0 8px 18px rgba(40,100,140,.18), inset 0 1px 0 #fff;
  }
  .cartao.arrastando { opacity: .4; }
  .cartao .texto { flex: 1; word-break: break-word; font-size: 14px; }
  .cartao .texto span[contenteditable] { outline: none; display: block; }
  .cartao.feito { background: linear-gradient(180deg, #fbfffd, #eefaf5); border-color: #cfeade; }
  .cartao.feito::before { background: linear-gradient(180deg, #7fe6bf, var(--menta)); animation: none; }
  .cartao.feito .texto span[contenteditable] { color: #6d9a8b; text-decoration: line-through; }

  .etiqueta {
    display: inline-flex; align-items: center; gap: 5px; margin-bottom: 5px;
    font: 800 9px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-fraca);
  }
  .etiqueta::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: var(--cor); box-shadow: 0 0 0 1px rgba(255,255,255,.8); }

  .setas { display: flex; gap: 3px; opacity: 0; transition: opacity .15s; }
  .cartao:hover .setas { opacity: 1; }
  .setas button {
    width: 21px; height: 21px; border-radius: 5px; font: 400 12px/1 var(--pixel); color: #4a7f9f;
    background: linear-gradient(180deg, #fff, #e4f1fa);
    border: 1px solid #c3dcec; box-shadow: inset 0 1px 0 #fff;
  }
  .setas button:hover { background: linear-gradient(180deg, #d8f0ff, #a9d8f4); color: #14324a; }
  .setas button.x:hover { background: linear-gradient(180deg, #ffd9ea, #f7a8cc); border-color: #e78ab5; }
  .vazio { font: 400 10px/1 var(--pixel); letter-spacing: .18em; color: #9dbdd2; padding: 4px 2px 14px; }

  .nova {
    width: 100%; padding: 9px 12px; border-radius: 999px;
    background: #f7fbfe; color: var(--tinta);
    border: 1px solid var(--borda);
    box-shadow: inset 0 1px 3px rgba(60,110,150,.12);
    font: 400 12px/1 var(--sans);
  }
  .nova::placeholder { color: #9dbdd2; font-family: var(--pixel); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .nova:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(43,127,192,.15); }
  .nova:disabled { opacity: .55; cursor: not-allowed; }

  /* ---------- rodapé ---------- */
  .rodape { display: flex; align-items: center; gap: 12px; margin-top: 20px; padding: 0 2px; }
  .rodape .linha { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--borda-forte) 0 2px, transparent 2px 6px); }
  .rodape .titulo { font: 700 13px/1 var(--sans); color: #4a7f9f; letter-spacing: .04em; }
</style>
</head>
<body>

<div class="folha">

  <header class="banner painel">
    <div class="esq">
      <div class="marca">
        <h1>ORGANIZER</h1>
        <svg class="estrela" viewBox="-140 -140 280 280" aria-hidden="true">
          <path class="cintila" fill="#7fc4ec" d="M0-120C10-40 40-10 120 0 40 10 10 40 0 120-10 40-40 10-120 0-40-10-10-40 0-120Z"/>
        </svg>
      </div>
      <div class="sub">
        <span class="lema">backlog dos meus projetos</span>
        <span class="linha"></span>
        <span class="pixels"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="backup">
        <button class="pill" id="exportar">exportar</button>
        <button class="pill" id="importar">importar</button>
        <span class="hud" id="carimbo"></span>
      </div>
    </div>

    <div class="vitrine" aria-hidden="true">
      <div class="blob holo"></div>
      <div class="flare"></div>
      <div class="bolha" style="left:70%;top:14%;width:44px;height:44px"></div>
      <div class="bolha" style="left:60%;top:60%;width:26px;height:26px"></div>
      <div class="bolha" style="left:16%;top:66%;width:16px;height:16px"></div>
      <svg class="grade" viewBox="0 0 200 200" fill="none" stroke="#4b86ab" stroke-width="1">
        <circle cx="100" cy="100" r="78"/>
        <ellipse cx="100" cy="100" rx="78" ry="26"/>
        <ellipse cx="100" cy="100" rx="78" ry="52"/>
        <ellipse cx="100" cy="100" rx="26" ry="78"/>
        <ellipse cx="100" cy="100" rx="52" ry="78"/>
      </svg>
      <svg viewBox="-140 -140 280 280" style="position:absolute;left:8%;top:18%;width:30px" aria-hidden="true">
        <path class="cintila" fill="#fff" d="M0-120C10-40 40-10 120 0 40 10 10 40 0 120-10 40-40 10-120 0-40-10-10-40 0-120Z"/>
      </svg>
      <svg viewBox="-140 -140 280 280" style="position:absolute;left:78%;top:70%;width:18px" aria-hidden="true">
        <path class="cintila" style="animation-delay:-1.7s" fill="#fff" d="M0-120C10-40 40-10 120 0 40 10 10 40 0 120-10 40-40 10-120 0-40-10-10-40 0-120Z"/>
      </svg>
    </div>
  </header>

  <nav class="barra painel">
    <div class="projetos" id="projetos"></div>
    <div class="widget" id="widget" hidden>
      <div class="cima"><span class="hud">progresso</span><span class="placar" id="placar"></span></div>
      <div class="celulas" id="celulas"></div>
    </div>
  </nav>

  <div class="faixa">
    <span class="seta"></span>
    <span class="barcode"></span>
    <h2 id="titulo">backlog</h2>
    <span class="diamante"></span>
    <span class="linha"></span>
    <div class="acoes" id="acoes"></div>
  </div>

  <main id="quadro"></main>

  <div class="rodape">
    <span class="titulo">... organizer</span>
    <span class="linha"></span>
    <span class="pixels"><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="hud">armazenamento local · sem servidor</span>
  </div>
</div>

<input type="file" id="arquivo" accept="application/json" hidden>

<script>
const CHAVE = 'organizer.kanban.v1';
const COLUNAS = [
  ['backlog', 'Backlog', '#7ba8c6'],
  ['fazendo', 'Fazendo', '#2b7fc0'],
  ['feito',   'Feito',   '#35b58a'],
];
const CELULAS = 24;

let dados = carregar();
let arrastando = null;

function carregar() {
  try {
    const bruto = JSON.parse(localStorage.getItem(CHAVE));
    if (bruto && Array.isArray(bruto.projetos)) return bruto;
  } catch {}
  const id = novoId();
  return { projetos: [{ id, nome: 'Geral' }], tarefas: [], filtro: id };
}

function salvar() { localStorage.setItem(CHAVE, JSON.stringify(dados)); }
function novoId() { return Math.random().toString(36).slice(2, 10); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function cor(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 72% 60%)`;
}
function visiveis() {
  return dados.filtro === 'todos' ? dados.tarefas : dados.tarefas.filter(t => t.projeto === dados.filtro);
}

(function carimbo() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById('carimbo').textContent =
    `[ ${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ]`;
})();

/* ---------- projetos ---------- */
function campoChip(valor, aoConfirmar) {
  const i = document.createElement('input');
  let fechado = false;
  i.className = 'entrada';
  i.value = valor;
  i.placeholder = 'nome do projeto';
  const fechar = confirmar => {
    if (fechado) return;
    fechado = true;
    const v = i.value.trim();
    if (confirmar && v) aoConfirmar(v); else desenhar();
  };
  i.onkeydown = e => {
    if (e.key === 'Enter') fechar(true);
    if (e.key === 'Escape') fechar(false);
  };
  i.onblur = () => fechar(true);
  return i;
}

function desenharProjetos() {
  const alvo = document.getElementById('projetos');
  alvo.innerHTML = '';
  const pill = (rotulo, valor) => {
    const b = document.createElement('button');
    b.className = 'pill' + (dados.filtro === valor ? ' on' : '');
    b.textContent = rotulo;
    b.onclick = () => { dados.filtro = valor; salvar(); desenhar(); };
    return b;
  };
  alvo.append(pill('Todos', 'todos'));
  dados.projetos.forEach(p => alvo.append(pill(p.nome, p.id)));

  const add = document.createElement('button');
  add.className = 'pill novo';
  add.textContent = '+ projeto';
  add.onclick = () => {
    const campo = campoChip('', nome => {
      const p = { id: novoId(), nome };
      dados.projetos.push(p);
      dados.filtro = p.id;
      salvar(); desenhar();
    });
    add.replaceWith(campo);
    campo.focus();
  };
  alvo.append(add);

  /* título da faixa + ações do projeto ativo */
  const atual = dados.projetos.find(p => p.id === dados.filtro);
  document.getElementById('titulo').textContent = atual ? atual.nome : 'todos os projetos';

  const acoes = document.getElementById('acoes');
  acoes.innerHTML = '';
  if (!atual) return;

  const ren = document.createElement('button');
  ren.textContent = 'renomear';
  ren.onclick = () => {
    const campo = campoChip(atual.nome, nome => { atual.nome = nome; salvar(); desenhar(); });
    alvo.querySelector('.pill.on').replaceWith(campo);
    campo.focus(); campo.select();
  };

  const exc = document.createElement('button');
  exc.textContent = 'excluir';
  exc.onclick = () => {
    const n = dados.tarefas.filter(t => t.projeto === atual.id).length;
    if (!confirm(`Excluir "${atual.nome}" e suas ${n} tarefa(s)?`)) return;
    dados.projetos = dados.projetos.filter(p => p.id !== atual.id);
    dados.tarefas = dados.tarefas.filter(t => t.projeto !== atual.id);
    dados.filtro = 'todos';
    salvar(); desenhar();
  };

  acoes.append(ren, exc);
}

/* ---------- medidor ---------- */
function desenharMedidor() {
  const lista = visiveis();
  const widget = document.getElementById('widget');
  widget.hidden = !lista.length;
  if (!lista.length) return;

  const feitas = lista.filter(t => t.coluna === 'feito').length;
  const pct = feitas / lista.length;
  const celulas = document.getElementById('celulas');
  if (celulas.children.length !== CELULAS) {
    celulas.innerHTML = '';
    for (let i = 0; i < CELULAS; i++) {
      const c = document.createElement('i');
      c.style.setProperty('--i', i);
      celulas.append(c);
    }
  }
  const acesas = Math.round(pct * CELULAS);
  [...celulas.children].forEach((c, i) => c.classList.toggle('on', i < acesas));
  document.getElementById('placar').textContent =
    `${String(feitas).padStart(2, '0')} / ${String(lista.length).padStart(2, '0')} · ${Math.round(pct * 100)}%`;
}

/* ---------- quadro ---------- */
function desenharQuadro() {
  const quadro = document.getElementById('quadro');
  quadro.innerHTML = '';
  const todos = dados.filtro === 'todos';

  COLUNAS.forEach(([id, rotulo, ac], i) => {
    const tarefas = visiveis().filter(t => t.coluna === id);

    const col = document.createElement('section');
    col.className = 'coluna painel';
    col.style.setProperty('--ac', ac);
    col.innerHTML =
      `<h3><span class="indice">0${i + 1}</span>${rotulo}` +
      `<span class="risca"></span><span class="contador">${String(tarefas.length).padStart(2, '0')}</span></h3>`;

    if (id === 'feito' && tarefas.length) {
      const limpar = document.createElement('button');
      limpar.className = 'limpar';
      limpar.textContent = 'limpar';
      limpar.onclick = () => {
        if (!confirm(`Apagar ${tarefas.length} tarefa(s) concluída(s)?`)) return;
        const fora = new Set(tarefas.map(t => t.id));
        dados.tarefas = dados.tarefas.filter(t => !fora.has(t.id));
        salvar(); desenhar();
      };
      col.querySelector('h3').append(limpar);
    }

    if (!tarefas.length) {
      const vazio = document.createElement('p');
      vazio.className = 'vazio';
      vazio.textContent = '— vazio —';
      col.append(vazio);
    }

    tarefas.forEach(t => col.append(cartao(t, i, todos)));

    const nova = document.createElement('input');
    nova.className = 'nova';
    nova.placeholder = todos ? 'escolha um projeto' : '+ nova tarefa';
    nova.disabled = todos;
    nova.onkeydown = e => {
      if (e.key !== 'Enter' || !nova.value.trim()) return;
      dados.tarefas.push({ id: novoId(), projeto: dados.filtro, coluna: id, texto: nova.value.trim() });
      salvar(); desenhar();
      const campos = document.querySelectorAll('.nova');
      campos[i] && campos[i].focus();
    };
    col.append(nova);

    col.ondragover = e => { e.preventDefault(); col.classList.add('alvo'); };
    col.ondragleave = () => col.classList.remove('alvo');
    col.ondrop = e => { e.preventDefault(); col.classList.remove('alvo'); mover(arrastando, id); };

    quadro.append(col);
  });
}

function cartao(t, i, mostrarEtiqueta) {
  const el = document.createElement('article');
  el.className = 'cartao' + (t.coluna === 'feito' ? ' feito' : '');
  el.draggable = true;

  const corpo = document.createElement('div');
  corpo.className = 'texto';
  if (mostrarEtiqueta) {
    const p = dados.projetos.find(p => p.id === t.projeto);
    if (p) corpo.innerHTML = `<span class="etiqueta" style="--cor:${cor(p.id)}">${esc(p.nome)}</span>`;
  }
  const linha = document.createElement('span');
  linha.contentEditable = 'true';
  linha.textContent = t.texto;
  linha.onblur = () => {
    const novo = linha.textContent.trim();
    if (!novo) { apagar(t.id); return; }
    if (novo !== t.texto) { t.texto = novo; salvar(); }
  };
  linha.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); linha.blur(); } };
  corpo.append(linha);

  const setas = document.createElement('div');
  setas.className = 'setas';
  if (i > 0) setas.append(botao('‹', () => mover(t.id, COLUNAS[i - 1][0])));
  if (i < COLUNAS.length - 1) setas.append(botao('›', () => mover(t.id, COLUNAS[i + 1][0])));
  const x = botao('×', () => apagar(t.id));
  x.className = 'x';
  setas.append(x);

  el.append(corpo, setas);
  el.ondragstart = () => { arrastando = t.id; el.classList.add('arrastando'); };
  el.ondragend = () => el.classList.remove('arrastando');
  return el;
}

function botao(rotulo, acao) {
  const b = document.createElement('button');
  b.textContent = rotulo;
  b.onclick = acao;
  return b;
}

function mover(id, coluna) {
  const t = dados.tarefas.find(t => t.id === id);
  if (!t || t.coluna === coluna) return;
  t.coluna = coluna;
  dados.tarefas = dados.tarefas.filter(x => x !== t).concat(t);
  salvar(); desenhar();
}

function apagar(id) {
  dados.tarefas = dados.tarefas.filter(t => t.id !== id);
  salvar(); desenhar();
}

/* ---------- backup ---------- */
document.getElementById('exportar').onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `organizer-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('importar').onclick = () => document.getElementById('arquivo').click();
document.getElementById('arquivo').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const lido = JSON.parse(await f.text());
    if (!Array.isArray(lido.projetos) || !Array.isArray(lido.tarefas)) throw 0;
    if (!confirm('Isso substitui tudo o que está salvo aqui. Continuar?')) return;
    dados = lido;
    salvar(); desenhar();
  } catch {
    alert('Arquivo inválido.');
  }
  e.target.value = '';
};

function desenhar() { desenharProjetos(); desenharMedidor(); desenharQuadro(); }
desenhar();
</script>
</body>
